const T = 48, W = MAP_SOLID[0].length, H = MAP_SOLID.length;
const grid = new Uint8Array(W * H);     // 1 = blocks movement (walls, built-ins, closed doors, crates)

for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {

}
const BASE_GRID = grid.slice(), BASE_OPQ = opq.slice(), BASE_SOLID = solidAt.slice();
const SPAWN = { x: 27.5 * T, y: 40.5 * T };   // out on the street, facing the hotel entrance

const wall = (i, j) => i < 0 || j < 0 || i >= W || j >= H || grid[j * W + i] === 1;
const opaque = (i, j) => i < 0 || j < 0 || i >= W || j >= H || opq[j * W + i] === 1;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };

/* ---------- materials ---------- */
const FLOOR_COL = {   // brighter, distinct per room: lit areas read clearly, dark ones stay dark
  m: ['#6a6052', '#72685a'], M: ['#3a3128'], e: ['#5b5650', '#625d56'], w: ['#6b4a32'], k: ['#5d6870'],

};
/* Movable furniture and props: hp, chance a passing bullet hits it, weight, the bits it sheds, its wreck colours.

const FURN = {

  L: { hp: 60, chance: 0.35, mass: 1.0, bits: ['#c8a64a', '#8a3a3a', '#3a6a8a'], shape: 'chip', wreck: ['#a88a3c', '#8a3a3a', '#3a6a8a'] },

  ochair: { hp: 40, chance: 0.15, mass: 0.45, bits: ['#2c2e34', '#5a5d66'], shape: 'chip', wreck: ['#2c2e34', '#46484f'] },
  toilet: { hp: 70, chance: 0.45, mass: 99, fixed: true, bits: ['#eef0f2', '#cfd4d9'], shape: 'shard', wreck: ['#e2e5e8', '#c2c7cc', '#9aa0a6'] },
  urinal: { hp: 60, chance: 0.40, mass: 99, fixed: true, bits: ['#eef0f2', '#cfd4d9'], shape: 'shard', wreck: ['#e2e5e8', '#c2c7cc'] },
  stall:  { hp: 90, chance: 0.60, mass: 99, fixed: true, bits: ['#8c9aa4', '#6f7c86'], shape: 'chip', wreck: ['#7d8a94', '#5f6b74'] },
  cab:    { hp: 140, chance: 0.55, mass: 99, fixed: true, bits: ['#8a9098', '#e8e4d8'], shape: 'chip', wreck: ['#6f757d', '#e8e4d8'] },
  bin:    { hp: 25, chance: 0.25, mass: 0.5, bits: ['#4a4e56', '#d8d0b8'], shape: 'chip', wreck: ['#3a3e46', '#d8d0b8'] },
  lamp:   { hp: 20, chance: 0.18, mass: 0.4, bits: ['#f0e6c8', '#3a3a3a'], shape: 'shard', wreck: ['#d8ccae', '#2e2e2e'] },
  vend:   { hp: 160, chance: 0.65, mass: 99, fixed: true, bits: ['#3a5a9a', '#d0d6de', '#e85a3a'], shape: 'shard', wreck: ['#2a4a7a', '#9aa4b0'] },
  slamp:  { hp: 200, chance: 0.5, mass: 99, fixed: true, bits: ['#6a6e76', '#f0e0b0'], shape: 'shard', wreck: ['#4a4e56', '#f0e0b0'] },
  tcan:   { hp: 60, chance: 0.4, mass: 1.2, bits: ['#4a5a44', '#7a7a6a'], shape: 'chip', wreck: ['#3a4a36', '#6a6a5a'] },
  hydr:   { hp: 300, chance: 0.6, mass: 99, fixed: true, bits: ['#c8382e', '#8a241e'], shape: 'chip', wreck: ['#b8322a', '#8a241e'] },

};
const FIXED_CHANCE = { c: 0.35, y: 0.35, B: 0.3, K: 0.3, D: 0.3, S: 0.35 };   // built-ins: hit chance per tile a bullet crosses
const WALL_BITS = ['#6a6a70', '#55555c', '#7e7e86'], WOOD_BITS = ['#8a6440', '#5e4028', '#9a7450'], GLASS_BITS = ['#a8c8e0', '#c8dcec', '#6a7078'];
const CRATE_HP = 110, DOOR_HP = 90, DOOR_MUL = 3;
const WALL_HP = 480;                       // a wall tile takes ~35-40 rifle hits; chunks fall off on the way
const GLASS_NOISE = 320, WALL_NOISE = 380; // shattering glass and a collapsing wall are loud
const CHUNK_BITS = ['#4a4a52', '#3c3c43', '#5a5a62'];
/* Doors are hinged slabs: walk into one and you shove it open (they swing both ways). Fire, restroom, kitchen and
   street doors have closers that pull them shut; office-type doors stay wherever they were left. */
const DOOR = { thick: 4, push: 1.15, damp: 2.0, closer: 4, max: 1.75, noise: 240 };
const SELF_CLOSING = [true, true, true, true, true, true, false, false, false, false, false, true, true];   // per DOOR_DEFS entry   // opens when someone is this close; stays open this long; creak reach
const SCRAPE_NOISE = 200;                                        // dragging furniture makes noise too
const PUSH_POWER = 1.0;                                          // heavier furniture moves slower when pushed
/* Doorways that get doors (inclusive tile ranges). The wide arches and the main entrance stay open. */
const DOOR_DEFS = [
  [3, 16, 4, 16],   // kitchen swing doors
  [13, 16, 13, 16], // women's restroom
  [16, 6, 16, 6],   // men's restroom
  [10, 1, 10, 2],   // kitchen -> back corridor
  [27, 3, 28, 3],   // stairwell
  [40, 3, 41, 3],   // staff corridor -> back corridor
  [39, 7, 39, 8],   // elevator hall -> staff corridor
  [39, 14, 39, 14], // reception staff door
  [42, 6, 42, 7],   // meeting room
  [42, 13, 42, 13], // office
  [40, 16, 41, 16], // staff corridor -> lounge
  [6, 30, 7, 30],   // restaurant street door
  [52, 30, 53, 30]  // lounge fire exit
];

let EDGES = null, FLOOR_ART = null, artG = null;
let pieces = [], doors = [];
const doorAt = new Int16Array(W * H).fill(-1);
const occ = new Uint8Array(W * H);      // tiles taken by movable furniture (for route planning)
let occDirty = false, occT = 0;
const crateHp = new Map();
const coverComp = new Int32Array(W * H);   // which piece of built-in low cover each tile belongs to (-1 = none)
const wallHp = new Map();
const debris = [];                      // bits in flight; once they stop they're painted into the floor for good
const BLOOD_CELL = 12, BMW = Math.ceil(W * T / BLOOD_CELL), BMH = Math.ceil(H * T / BLOOD_CELL);
const bloodMap = new Uint8Array(BMW * BMH);   // how much blood is on each 12px patch of floor

/* Rebuild the whole world: walls, furniture, doors, floor art. Called at start and on restart. */
function initWorld() {
  grid.set(BASE_GRID); opq.set(BASE_OPQ);
  for (let k = 0; k < W * H; k++) solidAt[k] = BASE_SOLID[k];
  pieces = buildPieces();
  doors = buildDoors();
  buildProps();
  crateHp.clear(); wallHp.clear();
  rebuildEdges(); rebuildOcc(); occDirty = false;
  buildCoverComps();
  debris.length = 0; bloodMap.fill(0);
  FLOOR_ART = buildFloorArt(); artG = FLOOR_ART.getContext('2d');
}

/* Group built-in low cover (counters, bar, banquette, big desks, cars, window sills) into whole objects. */
function buildCoverComps() {
  const cls = c => (c === 'G' || c === 'g') ? 'W' : 'BKDScy'.includes(c) && c !== '.' ? c : null;
  coverComp.fill(-1);
  let id = 0;
  for (let k = 0; k < W * H; k++) {
    if (coverComp[k] >= 0) continue;
    const c0 = cls(solidAt[k]);
    if (!c0) continue;
    const stack = [k]; coverComp[k] = id;
    while (stack.length) {
      const q = stack.pop(), qi = q % W, qj = (q / W) | 0;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const ni = qi + dx, nj = qj + dy, n = nj * W + ni;
        if (ni < 0 || nj < 0 || ni >= W || nj >= H || coverComp[n] >= 0 || cls(solidAt[n]) !== c0) continue;
        coverComp[n] = id; stack.push(n);
      }
    }
    id++;
  }
}
function buildPieces() {
  const out = [], seen = new Uint8Array(W * H);
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    const k = j * W + i, c = solidAt[k];
    if (!FURN[c] || seen[k]) continue;
    let w = 1; while (i + w < W && solidAt[k + w] === c && !seen[k + w]) w++;
    let h = 1;
    grow: while (j + h < H) { for (let q = 0; q < w; q++) if (solidAt[(j + h) * W + i + q] !== c || seen[(j + h) * W + i + q]) break grow; h++; }
    for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) seen[(j + yy) * W + i + xx] = 1;
    if (w * h > 4) continue;                       // big pieces are built in and stay part of the map
    for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) { const kk = (j + yy) * W + i + xx; solidAt[kk] = '.'; grid[kk] = 0; }
    const area = w * h, inset = c === 't' ? 9 : 3, F = FURN[c], hp = F.hp * Math.sqrt(area);
    out.push({ c, x: i * T + inset, y: j * T + inset, w: w * T - inset * 2, h: h * T - inset * 2, pad: 3,
      hp, maxHp: hp, mass: F.mass * area, holes: [], seed: Math.random() * 1000, scrape: 0, broken: false, pusher: null,
      room: floorAt[(j + (h >> 1)) * W + i + (w >> 1)] });
  }
  return out;
}

function buildDoors() {
  doorAt.fill(-1);
  return DOOR_DEFS.map(([x0, y0, x1, y1], idx) => {
    const axis = y0 === y1 && (x0 !== x1 || (wall(x0 - 1, y0) && wall(x1 + 1, y0))) ? 'h' : 'v';
    const tiles = [];
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const k = y * W + x; tiles.push(k); doorAt[k] = idx; }
    const side = axis === 'h' ? (wall(x0, y0 + 1) ? -1 : 1) : (wall(x0 + 1, y0) ? -1 : 1);   // swing into the open side
    const n = axis === 'h' ? x1 - x0 + 1 : y1 - y0 + 1, leaves = [];
    if (axis === 'h') {
      const yc = (y0 + 0.5) * T;
      if (n === 1) leaves.push({ hx: x0 * T, hy: yc, base: 0, L: T });
      else { leaves.push({ hx: x0 * T, hy: yc, base: 0, L: n * T / 2 }); leaves.push({ hx: (x1 + 1) * T, hy: yc, base: Math.PI, L: n * T / 2 }); }
    } else {
      const xc = (x0 + 0.5) * T;
      if (n === 1) leaves.push({ hx: xc, hy: y0 * T, base: Math.PI / 2, L: T });
      else { leaves.push({ hx: xc, hy: y0 * T, base: Math.PI / 2, L: n * T / 2 }); leaves.push({ hx: xc, hy: (y1 + 1) * T, base: -Math.PI / 2, L: n * T / 2 }); }
    }
    for (const l of leaves) { l.th = 0; l.w = 0; l.creak = false; }
    const d = { axis, tiles, rx0: x0 * T, ry0: y0 * T, rx1: (x1 + 1) * T, ry1: (y1 + 1) * T, n, side, leaves,
      closer: SELF_CLOSING[idx], hp: DOOR_HP, broken: false, closed: false };
    setDoorSolid(d, true);
    return d;
  });
}
function setDoorSolid(d, closed) {   // the slab itself blocks bodies and bullets; the doorway just stops light while it's shut
  d.closed = closed;
  for (const k of d.tiles) { grid[k] = 0; opq[k] = closed ? 1 : 0; }
}

/* Outlines of walls/columns/crates (what light can catch). */
function rebuildEdges() {
  EDGES = new Path2D();
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    if (!opq[j * W + i] || doorAt[j * W + i] >= 0) continue;
    const px = i * T, py = j * T;
    const o = (a, b) => opaque(a, b) && (a < 0 || b < 0 || a >= W || b >= H || doorAt[b * W + a] < 0);
    if (!o(i, j - 1)) { EDGES.moveTo(px, py); EDGES.lineTo(px + T, py); }
    if (!o(i, j + 1)) { EDGES.moveTo(px, py + T); EDGES.lineTo(px + T, py + T); }
    if (!o(i - 1, j)) { EDGES.moveTo(px, py); EDGES.lineTo(px, py + T); }
    if (!o(i + 1, j)) { EDGES.moveTo(px + T, py); EDGES.lineTo(px + T, py + T); }
  }
}
function rebuildOcc() {
  occ.fill(0);
  for (const f of pieces) {
    if (f.broken || (!f.fixed && f.mass < 1)) continue;   // chairs, stools, bins: bots just shove them aside
    const i0 = Math.floor((f.x + 6) / T), i1 = Math.floor((f.x + f.w - 6) / T);
    const j0 = Math.floor((f.y + 6) / T), j1 = Math.floor((f.y + f.h - 6) / T);
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) if (i >= 0 && j >= 0 && i < W && j < H) occ[j * W + i] = 1;
  }
}

/* Does a straight line enter this box? Returns the distance where it enters (0 if it starts inside), or -1. */
function segBox(ox, oy, ux, uy, maxD, x, y, w, h) {
  let t0 = 0, t1 = maxD;
  if (Math.abs(ux) < 1e-9) { if (ox < x || ox > x + w) return -1; }

}

/* Floors, built-in furniture and street details are painted once into an offscreen image.
   Debris, casings, bullet holes, blood and wrecks are painted into it later and stay there. */
function buildFloorArt() {
  const cvs = document.createElement('canvas');
  cvs.width = W * T; cvs.height = H * T;
  const g = cvs.getContext('2d');
  const hash = (i, j) => ((i * 73856093) ^ (j * 19349663)) >>> 0;
  const line = (x0, y0, x1, y1) => { g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); };
  const rr = (x, y, w, h, r) => {
    r = Math.min(r, w / 2, h / 2);

    g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);

  // 1) floors, with quiet textures

      }

      for (let q = 0; q < T; q += step) { line(x + q, y, x + q, y + T); line(x, y + q, x + T, y + q); }
    } else if (fl === 'o') {                                     // carpet tiles
      g.strokeStyle = '#434c66'; g.strokeRect(x + 0.5, y + 0.5, T - 1, T - 1);
      g.fillStyle = 'rgba(255,255,255,0.025)'; if ((i + j) & 1) g.fillRect(x + 1, y + 1, T - 2, T - 2);
    } else if (fl === 's') {                                     // paving slabs
      g.strokeStyle = '#5c5d61'; g.strokeRect(x + 0.5, y + 0.5, T - 1, T - 1);
      if ((hash(i, j) & 7) === 0) { g.strokeStyle = '#55565a'; line(x + 6, y + 10, x + 22, y + 30); }   // a crack
    } else if (fl === 'z') {                                     // concrete
      g.fillStyle = '#616063';
      for (let q = 0; q < 6; q++) { const hh = hash(i * 7 + q, j * 13 + q); g.fillRect(x + hh % 46, y + (hh >>> 8) % 46, 2, 2); }
    } else if (fl === 'r') {                                     // wine carpet with a diamond weave
      g.strokeStyle = 'rgba(0,0,0,0.12)';
      g.beginPath(); g.moveTo(x, y + T / 2); g.lineTo(x + T / 2, y); g.lineTo(x + T, y + T / 2); g.lineTo(x + T / 2, y + T); g.closePath(); g.stroke();
    } else if (fl === 'm' && !(i & 1) && !(j & 1)) {             // marble grout every two tiles
      g.strokeStyle = '#5c5346'; g.strokeRect(x + 0.5, y + 0.5, T * 2 - 1, T * 2 - 1);
      g.strokeStyle = 'rgba(255,255,255,0.05)'; line(x + 10, y + 70, x + 60, y + 20);   // a vein in the stone
    } else if (fl === 'a') {                                     // asphalt grain
      g.fillStyle = 'rgba(255,255,255,0.025)';
      for (let q = 0; q < 4; q++) { const hh = hash(i * 5 + q, j * 3 + q); g.fillRect(x + hh % 46, y + (hh >>> 9) % 46, 2, 2); }

  // street: curb, lane line, crosswalk, manholes, storm drains, oil stains
  g.strokeStyle = '#8a8b90'; g.lineWidth = 4; line(T, 35 * T, (W - 1) * T, 35 * T);
  g.strokeStyle = '#c8b04a'; g.lineWidth = 4; g.setLineDash([40, 32]); line(T, 39 * T, (W - 1) * T, 39 * T); g.setLineDash([]);
  g.fillStyle = 'rgba(235,235,240,0.32)';
  for (let y = 35 * T + 10; y < 43 * T - 12; y += 26) g.fillRect(25 * T + 6, y, 6 * T - 12, 13);
  for (const [mx, my] of [[8 * T, 38.5 * T], [41 * T, 40 * T]]) {
    g.fillStyle = '#2a2b2f'; g.beginPath(); g.arc(mx, my, 15, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#4a4b50'; g.lineWidth = 2; for (let r = 5; r < 15; r += 4) { g.beginPath(); g.arc(mx, my, r, 0, Math.PI * 2); g.stroke(); }
  }
  for (const dx of [12, 30, 46]) { g.fillStyle = '#26272b'; g.fillRect(dx * T, 35 * T + 2, 26, 9); g.strokeStyle = '#4a4b50'; g.lineWidth = 1; for (let q = 3; q < 26; q += 4) line(dx * T + q, 35 * T + 3, dx * T + q, 35 * T + 10); }
  for (const [ox, oy, r] of [[6 * T, 37 * T, 22], [43 * T, 41 * T, 28], [24 * T, 41.5 * T, 16]]) {
    const og = g.createRadialGradient(ox, oy, 0, ox, oy, r); og.addColorStop(0, 'rgba(0,0,0,0.28)'); og.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = og; g.beginPath(); g.ellipse(ox, oy, r, r * 0.6, 0.3, 0, Math.PI * 2); g.fill();
  }
  // red carpet trim and the lobby medallion
  g.strokeStyle = '#c9a24a'; g.lineWidth = 3;
  line(25 * T + 5, 31 * T, 25 * T + 5, 35 * T); line(31 * T - 5, 31 * T, 31 * T - 5, 35 * T);
  g.strokeStyle = '#8f8270'; g.lineWidth = 3;
  g.beginPath(); g.arc(27 * T, 21 * T, 2.3 * T, 0, Math.PI * 2); g.stroke();
  g.beginPath(); g.arc(27 * T, 21 * T, 1.5 * T, 0, Math.PI * 2); g.stroke();
  for (let q = 0; q < 8; q++) { const a = q * Math.PI / 4; line(27 * T + Math.cos(a) * 1.5 * T, 21 * T + Math.sin(a) * 1.5 * T, 27 * T + Math.cos(a) * 2.3 * T, 21 * T + Math.sin(a) * 2.3 * T); }
  g.fillStyle = '#b8a26a'; g.beginPath(); g.arc(27 * T, 21 * T, 10, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#a08a5a'; g.font = '700 22px "Arial Narrow","Roboto Condensed",Impact,sans-serif';
  g.textAlign = 'center'; g.fillText('WELCOME', 28 * T, 29 * T + 32);
  // rugs under the seating
  const rug = (x, y, w, h, base, border) => {
    g.fillStyle = base; rr(x, y, w, h, 4); g.fill();
    g.strokeStyle = border; g.lineWidth = 3; rr(x + 5, y + 5, w - 10, h - 10, 3); g.stroke();
    g.lineWidth = 1; g.strokeStyle = 'rgba(0,0,0,0.15)'; for (let q = x + 12; q < x + w - 12; q += 10) line(q, y + 10, q, y + h - 10);
  };
  rug(17.6 * T, 13.4 * T, 2.8 * T, 3.4 * T, '#5a3a4a', '#c9a46a');
  rug(17.6 * T, 25.4 * T, 2.8 * T, 3.4 * T, '#5a3a4a', '#c9a46a');
  rug(41.6 * T, 18.6 * T, 6.4 * T, 7.2 * T, '#4a2a2a', '#b88a4a');
  rug(23.2 * T, 5.2 * T, 9.6 * T, 1.6 * T, '#3a4a5a', '#8a9aaa');           // runner in the elevator hall
  // drains in the kitchen and restrooms
  for (const [dx, dy] of [[5.5 * T, 8.5 * T], [13.5 * T, 7.5 * T], [13.5 * T, 13.5 * T]]) {
    g.fillStyle = '#3a4045'; g.beginPath(); g.arc(dx, dy, 7, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#6a737a'; g.lineWidth = 1; for (let q = -5; q <= 5; q += 2.5) line(dx + q, dy - 5, dx + q, dy + 5);
  }

  g.fillStyle = 'rgba(235,230,215,0.8)';
  for (const [px, py, a] of [[45 * T, 13.2 * T, 0.4], [49.3 * T, 15.3 * T, -0.7], [52.6 * T, 14.5 * T, 1.1], [8.2 * T, 21.6 * T, 0.2]]) {
    g.save(); g.translate(px, py); g.rotate(a); g.fillRect(-6, -8, 12, 16); g.restore();
  }

  const seen = new Uint8Array(W * H);
  let carN = 0;
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    const c = solidAt[j * W + i];
    if (c === '.' || c === '#' || seen[j * W + i]) continue;
    let w = 1; while (i + w < W && solidAt[j * W + i + w] === c && !seen[j * W + i + w]) w++;
    let h = 1;
    grow: while (j + h < H) { for (let q = 0; q < w; q++) if (solidAt[(j + h) * W + i + q] !== c || seen[(j + h) * W + i + q]) break grow; h++; }
    for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) seen[(j + yy) * W + i + xx] = 1;
    const room = floorAt[(j + (h >> 1)) * W + i + (w >> 1)];
    drawFurniture(g, c, i * T, j * T, w * T, h * T, c === 'c' ? carN++ : 0, null, room);
  }
  return cvs;
}

/* Draw one piece of furniture, fixture or prop into any canvas context (the floor art or the live view).

function drawFurniture(g, c, x, y, w, h, n, f, room) {
  const rr = (x, y, w, h, r) => {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    g.beginPath(); g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);

      g.strokeStyle = '#2a2e36'; g.lineWidth = 2; line(x + w / 2, y + 12, x + w / 2, y + h - 2);
      g.strokeStyle = 'rgba(255,255,255,0.12)'; g.lineWidth = 1; for (let q = x + 9; q < x + w - 6; q += 5) line(q, y + 13, q, y + h - 3);
      break;

      g.fillStyle = '#626777'; rr(x + 11, y + 11, w - 22, h - 22, 4); g.fill();

      g.fillStyle = '#5a2f3c'; rr(x + 3, y + 3, w - 6, h - 6, 9); g.fill();
      g.fillStyle = '#86495b'; rr(x + 7, y + 7, w - 14, h - 14, 7); g.fill();
      g.fillStyle = '#6e3b4a';

      else { rr(x + w / 2 - 5, y + 12, 10, 10, 2); g.fill(); rr(x + w / 2 - 5, y + h - 22, 10, 10, 2); g.fill(); }

    }
    case 'D': {

        g.fillStyle = '#141418'; rr(x + 3, y + 3, w - 6, h - 6, 10); g.fill();
        g.strokeStyle = 'rgba(255,255,255,0.18)'; g.lineWidth = 1.5; rr(x + 8, y + 8, w - 16, h - 22, 8); g.stroke();

/* ---------- props: chairs, stools, restroom fixtures, office and street furniture ----------
   Chairs are their own objects now (pushed around, knocked over by bullets), set around the tables. */
function buildProps() {
  const free = (x, y, w, h) => {
    const i0 = Math.floor(x / T), i1 = Math.floor((x + w - 0.01) / T), j0 = Math.floor(y / T), j1 = Math.floor((y + h - 0.01) / T);
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) if (wall(i, j) || doorAt[j * W + i] >= 0) return false;
    for (const o of pieces) if (x < o.x + o.w && x + w > o.x && y < o.y + o.h && y + h > o.y) return false;
    return true;
  };
  const add = (c, cx, cy, w, h, extra) => {
    const x = cx - w / 2, y = cy - h / 2;
    if (!free(x, y, w, h)) return null;
    const F = FURN[c];
    const f = Object.assign({ c, x, y, w, h, pad: 0, hp: F.hp, maxHp: F.hp, mass: F.mass, fixed: !!F.fixed, rot: 0, holes: [],
      seed: Math.random() * 1000, scrape: 0, broken: false, pusher: null, room: floorAt[Math.floor(cy / T) * W + Math.floor(cx / T)] }, extra || {});
    pieces.push(f);
    return f;
  };
  const LAMP = { r: 120, col: [255, 214, 160], k: 0.5 };
  // tables: dining tables get chairs all round, lounge tables two, coffee tables by the sofas none
  for (const tb of pieces.filter(f => f.c === 't')) {
    const cx = tb.x + tb.w / 2, cy = tb.y + tb.h / 2;
    if (pieces.some(o => o.c === 'S' && Math.hypot(o.x + o.w / 2 - cx, o.y + o.h / 2 - cy) < 2.4 * T)) { tb.kind = 'coffee'; continue; }
    tb.kind = tb.room === 'r' ? 'bar' : 'dining';
    let n = 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      if (tb.kind === 'bar' && n >= 2) break;
      if (add('chair', cx + dx * 27, cy + dy * 27, 16, 16, { rot: Math.atan2(-dy, -dx) })) n++;
    }
  }
  // desks: an office chair at each, the piano in the lounge
  for (const dk of pieces.filter(f => f.c === 'D')) {
    if (dk.room === 'r') { dk.kind = 'piano'; continue; }
    dk.kind = 'desk';
    add('ochair', dk.x + dk.w / 2, dk.y + dk.h + 12, 18, 18, { rot: -Math.PI / 2 });
  }
  for (let q = 0; q < 6; q++) {                                    // meeting room chairs round the big table
    add('ochair', (46.5 + q) * T, 5.62 * T, 18, 18, { rot: Math.PI / 2 });
    add('ochair', (46.5 + q) * T, 8.38 * T, 18, 18, { rot: -Math.PI / 2 });
  }
  add('ochair', 37.4 * T, 17.5 * T, 18, 18, { rot: Math.PI });     // behind reception
  for (let q = 20; q <= 25; q++) add('stool', 50 * T - 13, (q + 0.5) * T, 14, 14);   // bar stools
  for (let q = 51; q <= 53; q++) add('stool', (q + 0.5) * T, 19 * T - 13, 14, 14);
  // restrooms: urinals and stalls in the men's, stalls in the women's
  add('urinal', 13.2 * T, 4 * T + 6, 16, 11); add('urinal', 14.5 * T, 4 * T + 6, 16, 11);
  add('toilet', 12.8 * T, 10 * T - 13, 16, 22, { rot: Math.PI / 2 }); add('toilet', 14.5 * T, 10 * T - 13, 16, 22, { rot: Math.PI / 2 });
  for (const sx of [12.0, 13.65, 15.35]) add('stall', sx * T, 10 * T - 17, 3, 34);
  add('toilet', 13.0 * T, 11 * T + 13, 16, 22, { rot: -Math.PI / 2 }); add('toilet', 14.6 * T, 11 * T + 13, 16, 22, { rot: -Math.PI / 2 });
  for (const sx of [12.2, 13.8, 15.4]) add('stall', sx * T, 11 * T + 17, 3, 34);
  add('bin', 12.1 * T, 7.9 * T, 12, 12); add('bin', 12.2 * T, 14.9 * T, 12, 12);
  // lobby, elevator hall, lounge
  add('lamp', 18.4 * T, 13.5 * T, 12, 12, { light: LAMP }); add('lamp', 18.4 * T, 29.4 * T, 12, 12, { light: LAMP });
  add('lamp', 44.7 * T, 28.5 * T, 12, 12, { light: LAMP });
  add('bin', 24.3 * T, 13.4 * T, 12, 12); add('bin', 31.7 * T, 13.4 * T, 12, 12);
  add('vend', 37.55 * T, 4.4 * T, 40, 26, { light: { r: 130, col: [150, 200, 255], k: 0.45 } });
  add('bin', 25.5 * T, 4.35 * T, 12, 12); add('bin', 30.5 * T, 4.35 * T, 12, 12);
  // office, meeting room, kitchen, back corridor
  add('cab', 50.5 * T, 11 * T + 11, 30, 20); add('cab', 52.2 * T, 11 * T + 11, 30, 20);
  add('bin', 43.6 * T, 15.5 * T, 12, 12); add('bin', 53.5 * T, 4.6 * T, 12, 12); add('bin', 2.4 * T, 14.6 * T, 14, 14);
  add('ccart', 24 * T, 1.6 * T, 34, 20); add('bin', 25.4 * T, 1.4 * T, 14, 14);
  // street: lamps, bins, a hydrant
  for (const lx of [8.5, 22.5, 33.5, 47.5]) add('slamp', lx * T, 34.6 * T, 10, 10, { light: { r: 300, col: [255, 196, 120], k: 0.9 } });
  add('tcan', 15.5 * T, 33.4 * T, 16, 16); add('tcan', 40.5 * T, 33.4 * T, 16, 16);
  add('hydr', 31.7 * T, 34.6 * T, 10, 10);
}

/* The dead drop what they carried: the rifle's magazine, the vest's spares, any plate still whole and the helmet if it stayed on. */

  for (const rounds of b.mags) addItem({ kind: 'mag', rounds }, b.x, b.y, 22);
  const pr = b.prot;
  if (pr.front > 0) addItem({ kind: 'plate', hp: pr.front, chips: pr.chipsF }, b.x, b.y, 22);
  if (pr.back > 0) addItem({ kind: 'plate', hp: pr.back, chips: pr.chipsB }, b.x, b.y, 22);
  if (pr.helmet > 0) addItem({ kind: 'helmet', hp: pr.helmet, chips: pr.chipsH }, b.x, b.y, 22);

/* Only take what's an upgrade: a mag while the vest has room (or one fuller than your emptiest spare),

  if (it.kind === 'helmet') return it.hp > p.prot.helmet;
  return it.hp > Math.min(p.prot.front, p.prot.back);
}

  const pr = p.prot;

    else { const i = mags.indexOf(Math.min(...mags)); addItem({ kind: 'mag', rounds: mags[i] }, p.x, p.y, 14); mags[i] = it.rounds; }
    pop(p.x, p.y, 'MAG ' + it.rounds, LOOT_COL.mag, 1.0);

    pr.helmet = it.hp; pr.chipsH = it.chips.slice(); pop(p.x, p.y, 'HELMET', LOOT_COL.helmet, 1.0);

    if (pr[side] > 0) addItem({ kind: 'plate', hp: pr[side], chips: pr[ck] }, p.x, p.y, 14);
    pr[side] = it.hp; pr[ck] = it.chips.slice();

    const d = Math.hypot(it.x - p.x, it.y - p.y);
    if (d < bd && canTake(it)) { bd = d; best = it; }

function soundMul(i, j) {
  if (i < 0 || j < 0 || i >= W || j >= H) return WALL_MUL;
  const k = j * W + i;
  if (doorAt[k] >= 0) { const d = doors[doorAt[k]]; return d.closed && !d.broken ? DOOR_MUL : 1; }   // closed doors muffle
  const c = solidAt[k];

  if (c === 'g') return 1;
  return c === '.' ? 1 : opq[k] ? WALL_MUL : FURN_MUL;

/* ---------- Sound ----------
   Sound spreads out in every direction but loses strength fast inside walls,
   so the reach is a circle in open space and shrinks where walls get in the way. */
function soundExtent(ox, oy, ang, radius) {
  const dx = Math.cos(ang), dy = Math.sin(ang);
  let mx = Math.floor(ox / T), my = Math.floor(oy / T);
  const ddx = Math.abs(1 / (dx || 1e-9)), ddy = Math.abs(1 / (dy || 1e-9));
  let stepX, stepY, sideX, sideY;
  if (dx < 0) { stepX = -1; sideX = (ox / T - mx) * ddx; } else { stepX = 1; sideX = (mx + 1 - ox / T) * ddx; }
  if (dy < 0) { stepY = -1; sideY = (oy / T - my) * ddy; } else { stepY = 1; sideY = (my + 1 - oy / T) * ddy; }
  let tPrev = 0, cost = 0, dist = 0;
  for (let n = 0; n < 200; n++) {
    const tNext = Math.min(sideX, sideY);
    const seg = (tNext - tPrev) * T;
    const mul = soundMul(mx, my);
    if (cost + seg * mul >= radius) return dist + (radius - cost) / mul;
    cost += seg * mul; dist += seg; tPrev = tNext;
    if (sideX < sideY) { sideX += ddx; mx += stepX; } else { sideY += ddy; my += stepY; }
  }
  return dist;
}

}

/* Any bot that isn't already fighting and sits inside the sound's reach goes to investigate. */
function hearSound(ext, x, y, jitter) {
  const hearers = [];

    if (b.dead || b.state === 'attack') continue;
    const dx = b.x - x, dy = b.y - y, d = Math.hypot(dx, dy);
    const e = extentAt(ext, Math.atan2(dy, dx));
    if (d > e) continue;
    hearers.push({ b, d, loud: 1 - d / Math.max(e, 1) });   // 1 = right next to it, 0 = barely audible
  }
  hearers.sort((a, c) => a.d - c.d);

  let going = 0;

    const b = h.b;
    const already = b.state === 'search';

/* ================= BULLET PHYSICS, DESTRUCTION AND DEBRIS ================= */
/* Bullets slow down as they fly (and hit softer), pass over low furniture unless they happen to hit it,
   punch into doors and crates, and can glance off walls, metal counters and cars. */
const BUL = { dragP: 0.8, dragB: 0.6, vMin: 260 };                       // speed lost per px travelled; below vMin they drop
const RICO = { base: 0.04, graze: 0.55, keep: 0.55, max: 2, jitter: 0.12, minV: 450 };   // ricochet odds rise at shallow angles

function makeBullet(x, y, ux, uy, v, dmg, owner) {
  return { x, y, ux, uy, v, v0: v, dmg, owner, bounces: 0, rolled: new Set() };
}

/* Walk the tiles a bullet crosses this frame and report the first thing it hits. */
function tileEvent(b, maxD) {
  let mx = Math.floor(b.x / T), my = Math.floor(b.y / T);
  const dx = b.ux, dy = b.uy;
  const ddx = Math.abs(1 / (dx || 1e-9)), ddy = Math.abs(1 / (dy || 1e-9));
  let stepX, stepY, sideX, sideY;
  if (dx < 0) { stepX = -1; sideX = (b.x / T - mx) * ddx; } else { stepX = 1; sideX = (mx + 1 - b.x / T) * ddx; }
  if (dy < 0) { stepY = -1; sideY = (b.y / T - my) * ddy; } else { stepY = 1; sideY = (my + 1 - b.y / T) * ddy; }
  for (let n = 0; n < 64; n++) {
    let t, nx = 0, ny = 0;
    if (sideX < sideY) { t = sideX; sideX += ddx; mx += stepX; nx = -stepX; }
    else { t = sideY; sideY += ddy; my += stepY; ny = -stepY; }
    const d = t * T;
    if (d >= maxD) return null;
    if (mx < 0 || my < 0 || mx >= W || my >= H) return { d, kind: 'hard', nx, ny, k: -1 };
    const k = my * W + mx;
    if (doorAt[k] >= 0) continue;                     // door slabs are checked on their own
    const c = solidAt[k];
    if (c === '.') continue;
    const comp = coverComp[k];
    if (comp >= 0 && !ownCover(b, null, comp)) {        // someone ducked behind this counter / car / sill takes no hits through it
      const who = shelters(null, comp, b.x + b.ux * d, b.y + b.uy * d, b);
      if (who) return (c === 'G' || c === 'g') ? { d, kind: 'sill', nx, ny, k, cover: who } : { d, kind: 'fixed', c, nx, ny, k, cover: who };
    } else if (comp >= 0 && (c !== 'G')) continue;      // your own cover: you're shooting over it
    if (c === 'G') return { d, kind: 'glass', nx, ny, k };
    if (c === 'g') continue;                      // broken window: straight through
    if (c === '#' || c === 'C' || c === 'E') return { d, kind: 'hard', nx, ny, k };
    if (c === 'X') return { d, kind: 'crate', nx, ny, k };
    if (!b.rolled.has(k)) { b.rolled.add(k); if (Math.random() < (FIXED_CHANCE[c] || 0.3)) return { d, kind: 'fixed', c, nx, ny, k }; }
  }
  return null;
}

/* Cover rules for bullets. */
function ownerOf(b) { return b.owner === 'p' ? p : b.owner; }
function ownCover(b, piece, comp) {                 // fired by someone touching this very object: it goes over it
  const o = ownerOf(b);
  if (!o || b.bounces > 0 || !o.cov || !o.cov.inCover) return false;
  return piece ? o.cov.piece === piece : o.cov.comp === comp;
}
function shelters(piece, comp, ex, ey, b) {         // someone touching this object is right behind it, in the bullet's path
  const test = c => {
    if (!c || c.dead || !c.cov || !c.cov.inCover) return false;
    if (b.bounces === 0 && ownerOf(b) === c) return false;
    if (piece ? c.cov.piece !== piece : (comp < 0 || c.cov.comp !== comp)) return false;
    const dx = c.x - ex, dy = c.y - ey, along = dx * b.ux + dy * b.uy;
    return along > 0 && along < 140 && Math.abs(dx * b.uy - dy * b.ux) < c.r + 14;
  };
  if (state === 'play' && test(p)) return p;
  for (const e of bots) if (test(e)) return e;
  return null;
}

/* Move one bullet; returns true when it's finished. */
function stepBullet(b, dt, drag) {
  const travel = b.v * dt;

    if (d.broken) continue;
    for (const l of d.leaves) {
      const a = l.base + l.th, ex = Math.cos(a) * l.L, ey = Math.sin(a) * l.L, den = b.ux * ey - b.uy * ex;
      if (Math.abs(den) < 1e-6) continue;
      const wx = l.hx - b.x, wy = l.hy - b.y, tt = (wx * ey - wy * ex) / den, uu = (wx * b.uy - wy * b.ux) / den;
      if (tt >= 0 && tt < best && uu >= 0 && uu <= 1) { best = tt; ev = { kind: 'door', door: d, leaf: l }; }
    }
  }
  for (const f of pieces) {                     // movable furniture: roll once per piece to see if this bullet clips it
    if (f.broken || b.rolled.has(f)) continue;
    const te = segBox(b.x, b.y, b.ux, b.uy, best, f.x, f.y, f.w, f.h);
    if (te < 0) continue;
    b.rolled.add(f);
    if (ownCover(b, f, -1)) continue;                                  // shooting over the thing you're behind
    const who = shelters(f, -1, b.x + b.ux * te, b.y + b.uy * te, b);  // someone's sheltering behind it: it soaks the shot
    if (who || Math.random() < FURN[f.c].chance) { best = te; ev = { kind: 'piece', f, cover: who }; }
  }
  const tryChar = (c, r) => {
    const s = clamp((c.x - b.x) * b.ux + (c.y - b.y) * b.uy, 0, best);
    const cx = b.x + b.ux * s - c.x, cy = b.y + b.uy * s - c.y;
    if (cx * cx + cy * cy < r * r && s < best) { best = s; ev = { kind: 'char', c }; }
  };
  // a ricochet can hit anyone, including whoever fired it
  if ((b.owner !== 'p' || b.bounces > 0) && state === 'play') tryChar(p, p.r + 2);
  if (b.owner === 'p' || b.bounces > 0) for (const e of bots) if (!e.dead) tryChar(e, e.r);

  const hx = b.x + b.ux * best, hy = b.y + b.uy * best;
  const dmg = b.dmg * (0.5 + 0.5 * b.v / b.v0);      // slower bullets hit softer
  const shooter = ownerOf(b);
  const whiz = c => {                                  // a round cracking past someone rattles them
    if (!c || c.dead || (c === shooter && b.bounces === 0) || (ev && ev.c === c)) return;
    if (b.supped && b.supped.has(c)) return;
    const sl = clamp((c.x - b.x) * b.ux + (c.y - b.y) * b.uy, 0, best), qx = b.x + b.ux * sl - c.x, qy = b.y + b.uy * sl - c.y, dd = Math.hypot(qx, qy);
    if (dd < SUPP.near) { (b.supped || (b.supped = new Set())).add(c); addSupp(c, SUPP.whiz * (1 - dd / SUPP.near)); }
  };
  if (state === 'play') whiz(p);
  for (const e of bots) whiz(e);
  b.v -= drag * best;
  if (!ev) { b.x = hx; b.y = hy; return b.v < BUL.vMin; }
  if (ev.kind !== 'char') suppressAt(hx, hy, shooter, 70, SUPP.impact);   // it smacked into something near them

  switch (ev.kind) {
    case 'char':
      takeHit(ev.c, dmg, hx, hy, b.ux, b.uy);         // plates, then helmet, then nothing
      return true;
    case 'piece': damagePiece(ev.f, dmg, hx, hy, b.ux, b.uy); coverJolt(ev.cover, ev.f, b); return true;
    case 'door':  damageDoor(ev.door, dmg, hx, hy, b.ux, b.uy, ev.leaf); return true;
    case 'crate': damageCrate(ev.k, dmg, hx, hy, b.ux, b.uy); return true;
    case 'sill':                                   // the wall under the window stops it (glass still breaks)
      if (solidAt[ev.k] === 'G') shatterWindow(ev.k, b, hx, hy);
      impact({ kind: 'hard', nx: ev.nx, ny: ev.ny }, hx, hy);
      coverJolt(ev.cover, null, b);
      return true;
    case 'glass':                                  // shatter it and keep going, a little slower
      shatterWindow(ev.k, b, hx, hy);
      b.x = hx + b.ux * 0.5; b.y = hy + b.uy * 0.5; b.v *= 0.85;
      return false;
    default: {                                         // 'hard' (walls, columns, elevators) or 'fixed' (built-ins, cars)
      impact(ev, hx, hy);
      coverJolt(ev.cover, null, b);
      const cos = Math.abs(b.ux * ev.nx + b.uy * ev.ny);
      const metal = ev.kind === 'hard' || ev.c === 'c' || ev.c === 'y' || ev.c === 'K';
      const chance = !metal ? 0 : ev.kind === 'hard' ? RICO.base + RICO.graze * (1 - cos) : 0.12 + 0.35 * (1 - cos);
      const ricochet = b.bounces < RICO.max && b.v > RICO.minV && Math.random() < chance;
      if (ev.kind === 'hard' && ev.k >= 0 && solidAt[ev.k] === '#') damageWall(ev.k, ricochet ? dmg * 0.3 : dmg, hx, hy, ev.nx, ev.ny, b.owner);
      if (ricochet) {
        const dot = b.ux * ev.nx + b.uy * ev.ny;
        const rx = b.ux - 2 * dot * ev.nx, ry = b.uy - 2 * dot * ev.ny;
        const j = (Math.random() * 2 - 1) * RICO.jitter, cj = Math.cos(j), sj = Math.sin(j);
        b.ux = rx * cj - ry * sj; b.uy = rx * sj + ry * cj;
        b.x = hx + ev.nx * 1.5; b.y = hy + ev.ny * 1.5;
        b.v *= RICO.keep; b.bounces++; b.rolled.clear();
        burst(hx, hy, 4, '#ffe9a8', 220);
        return false;
      }
      return true;
    }
  }
}

/* A shot thumps into the cover someone's behind: a movable piece gets knocked back against them, and they flinch. */
function coverJolt(c, f, b) {
  if (!c) return;
  if (f && !f.broken) movePiece(f, b.ux * 1.5, b.uy * 1.5);        // pressed back against them, not through them
  addSupp(c, SUPP.jolt);
  const a = c === p ? arms : c.arms;
  if (a) a.w += (Math.random() < 0.5 ? -1 : 1) * (0.6 + Math.random() * 0.6);
}
function hitBot(target, dmg, hx, hy, ux, uy) {
  target.hp -= dmg; target.flash = 0.12; addSupp(target, SUPP.hit);
  target.arms.w += (Math.random() < 0.5 ? -1 : 1) * (2 + Math.random() * 2);                 // flinch
  if (ux !== undefined) moveCircle(target, ux * 3, uy * 3);
  bleedHit(target, hx, hy, ux === undefined ? 0 : ux, uy === undefined ? 1 : uy);
  if (target.state !== 'attack') investigate(target, p.x, p.y);     // getting shot tells them where you are
  if (target.hp <= 0) killBot(target);
}
function killBot(b) {
  if (b.dead) return;
  b.dead = true; b.locked = false; b.bleed = 0;
  spray(b.x, b.y, 1, 0, 10, BLOOD, 'blood', 150, 3, Math.PI * 2);
  addPool(b.x, b.y);
  dropLoot(b);
}

/* ---------- blood ---------- */
/* A hit sprays blood out along the bullet's path (and a little back toward the shooter),
   spatters the floor, and may open a wound that bleeds for a few seconds. All of it stays on the floor. */
function bleedHit(c, hx, hy, ux, uy) {
  spray(hx, hy, ux, uy, 7 + ((Math.random() * 5) | 0), BLOOD, 'blood', 230, 3.2, 0.9);
  spray(hx, hy, -ux, -uy, 2, BLOOD, 'blood', 90, 2.6, 1.4);
  splat(hx + ux * 8, hy + uy * 8, 5 + Math.random() * 4, ux, uy);
  if (Math.random() < BLEED.chance) c.bleed = Math.max(c.bleed || 0, BLEED.min + Math.random() * (BLEED.max - BLEED.min));
}
function splat(x, y, r, ux, uy) {
  markBlood(x, y, r * 1.3, 160);
  artG.fillStyle = BLOOD[0];
  for (let i = 0; i < 5; i++) {
    const along = (Math.random() - 0.2) * r * 1.6, side = (Math.random() - 0.5) * r * 0.9;
    artG.globalAlpha = 0.85;
    artG.beginPath(); artG.arc(x + ux * along - uy * side, y + uy * along + ux * side, r * (0.35 + Math.random() * 0.45), 0, Math.PI * 2); artG.fill();
  }
  artG.globalAlpha = 1;
}
function stampBlood(d) {
  markBlood(d.x, d.y, 5, 35);
  artG.fillStyle = d.col;
  artG.beginPath(); artG.arc(d.x, d.y, d.size * 0.7, 0, Math.PI * 2); artG.fill();
  if (Math.random() < 0.5) {
    const a = Math.random() * Math.PI * 2, r = d.size * (1 + Math.random());
    artG.beginPath(); artG.arc(d.x + Math.cos(a) * r, d.y + Math.sin(a) * r, d.size * 0.3, 0, Math.PI * 2); artG.fill();
  }
}
/* An open wound: drips while it lasts (a trail if they're moving) and slowly drains health. Armor doesn't help. */
function updateBleed(c, dt) {
  if (!(c.bleed > 0) || c.dead) return;
  c.bleed -= dt;
  c.dripT = (c.dripT || 0) - dt;
  if (c.dripT <= 0) {
    c.dripT = 0.12 + Math.random() * 0.18;
    debris.push({ x: c.x + (Math.random() - 0.5) * 12, y: c.y + (Math.random() - 0.5) * 12, vx: (Math.random() - 0.5) * 24, vy: (Math.random() - 0.5) * 24,
      rot: 0, vr: 0, col: BLOOD[(Math.random() * 3) | 0], shape: 'blood', size: 1.5 + Math.random() * 1.6, fric: 9, t: 0 });
  }
  if (c === p) {
    p.hp -= BLEED.dps * dt;
    if (p.hp <= 0 && state === 'play') { p.hp = 0; state = 'dead'; stateT = 0; addPool(p.x, p.y); }
  } else {
    c.hp -= BLEED.dps * dt;
    if (c.hp <= 0) killBot(c);
  }
}
function markBlood(x, y, r, amt) {
  const i0 = Math.max(0, Math.floor((x - r) / BLOOD_CELL)), i1 = Math.min(BMW - 1, Math.floor((x + r) / BLOOD_CELL));
  const j0 = Math.max(0, Math.floor((y - r) / BLOOD_CELL)), j1 = Math.min(BMH - 1, Math.floor((y + r) / BLOOD_CELL));
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    const cx = (i + 0.5) * BLOOD_CELL - x, cy = (j + 0.5) * BLOOD_CELL - y;
    if (cx * cx + cy * cy <= r * r + BLOOD_CELL * BLOOD_CELL * 0.25) bloodMap[j * BMW + i] = Math.min(255, bloodMap[j * BMW + i] + amt);
  }
}
function bloodAt(x, y) {
  const i = Math.floor(x / BLOOD_CELL), j = Math.floor(y / BLOOD_CELL);
  return i < 0 || j < 0 || i >= BMW || j >= BMH ? 0 : bloodMap[j * BMW + i];
}
/* Boots: every step checks the floor under that foot. Step in blood and the next ~10 prints are red,
   fading as the boots dry. Prints point the way the body faces (so backing away leaves prints facing you). */
const BOOT = { step: 32, prints: 10, wet: 100 };
function bootStep(c, moved, faceAng, mvAng) {
  c.bootAcc = (c.bootAcc || 0) + moved;
  if (c.bootAcc < BOOT.step) return;
  c.bootAcc = Math.min(c.bootAcc - BOOT.step, BOOT.step);
  c.bootFoot = -(c.bootFoot || 1);
  const side = c.bootFoot * 5 * CHAR_SCALE;
  const fx = c.x - Math.sin(mvAng) * side, fy = c.y + Math.cos(mvAng) * side;
  let wet = bloodAt(fx, fy) >= BOOT.wet;
  if (!wet) for (const q of pools) if (Math.hypot(fx - q.x, fy - q.y) < q.r) { wet = true; break; }
  if (wet) { c.bloodSteps = BOOT.prints; return; }
  if (c.bloodSteps > 0) { stampBootPrint(fx, fy, faceAng, c.bloodSteps / BOOT.prints); c.bloodSteps--; }
}
function stampBootPrint(x, y, ang, strength) {
  artG.save(); artG.translate(x, y); artG.rotate(ang); artG.scale(CHAR_SCALE, CHAR_SCALE);
  artG.globalAlpha = 0.15 + 0.65 * strength;
  artG.fillStyle = BLOOD[1];
  artG.beginPath(); artG.ellipse(3, 0, 5.6, 2.8, 0, 0, Math.PI * 2); artG.fill();     // sole
  artG.beginPath(); artG.ellipse(-5.4, 0, 2.7, 2.5, 0, 0, Math.PI * 2); artG.fill();  // heel
  artG.restore();
}
function addPool(x, y) { pools.push({ x, y, r: 3, max: 22 + Math.random() * 12, rot: Math.random() * 3, t: 0 }); }
function drawPool(g, q) {
  g.fillStyle = 'rgba(88,6,12,0.9)';
  g.beginPath(); g.ellipse(q.x, q.y, q.r, q.r * 0.78, q.rot, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(130,16,26,0.35)';
  g.beginPath(); g.ellipse(q.x - q.r * 0.2, q.y - q.r * 0.15, q.r * 0.55, q.r * 0.4, q.rot, 0, Math.PI * 2); g.fill();
}
function updatePools(dt) {
  for (let i = pools.length - 1; i >= 0; i--) {
    const q = pools[i];
    q.t += dt; q.r += (q.max - q.r) * Math.min(1, dt * 0.7);         // spreads out over a few seconds
    if (q.t > 7) { drawPool(artG, q); markBlood(q.x, q.y, q.r, 255); pools.splice(i, 1); }   // then it's part of the floor
  }
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) if (stepBullet(bullets[i], dt, BUL.dragP)) bullets.splice(i, 1);
  for (let i = botBullets.length - 1; i >= 0; i--) if (stepBullet(botBullets[i], dt, BUL.dragB)) botBullets.splice(i, 1);
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (s.life <= 0) sparks.splice(i, 1);
  }
  for (let i = pops.length - 1; i >= 0; i--) { pops[i].life -= dt; if (pops[i].life <= 0) pops.splice(i, 1); }
}

/* ---------- impacts, damage, wrecks ---------- */
function impact(ev, hx, hy) {
  const nx = ev.nx, ny = ev.ny;
  if (ev.kind === 'hard') {
    spray(hx + nx * 2, hy + ny * 2, nx, ny, 2 + ((Math.random() * 3) | 0), WALL_BITS, 'chip', 140, 3, 2.2);
    burst(hx + nx * 2, hy + ny * 2, 3, 'rgba(150,150,160,0.7)', 50);   // dust puff
  } else {
    holeAt(hx - nx * 4, hy - ny * 4);                                  // permanent bullet hole in the fixture
    const car = ev.c === 'c' || ev.c === 'y';
    spray(hx + nx * 2, hy + ny * 2, nx, ny, 3, car ? GLASS_BITS : WOOD_BITS, car ? 'shard' : 'splinter', 120, 3, 2.4);
    if (car || ev.c === 'K') burst(hx, hy, 3, '#ffe9a8', 160);
  }
}
function holeAt(x, y) {
  artG.fillStyle = 'rgba(8,8,12,0.85)';
  artG.beginPath(); artG.arc(x, y, 2.4, 0, Math.PI * 2); artG.fill();
}
function damagePiece(f, dmg, hx, hy, ux, uy) {
  f.hp -= dmg;
  if (f.holes.length < 18) f.holes.push([clamp(hx - f.x + ux * 3, 2, f.w - 2), clamp(hy - f.y + uy * 3, 2, f.h - 2)]);
  const F = FURN[f.c];
  spray(hx - ux * 2, hy - uy * 2, -ux, -uy, 3, F.bits, F.shape, 110, 3, 2.6);
  if (f.hp <= 0) breakPiece(f);
}
function breakPiece(f) {
  f.broken = true; occDirty = true;
  const F = FURN[f.c];
  stampWreck(f.x - 3, f.y - 3, f.w + 6, f.h + 6, F.wreck);
  spray(f.x + f.w / 2, f.y + f.h / 2, 1, 0, 12, F.bits, F.shape, 170, 4, Math.PI * 2);
}
function damageDoor(d, dmg, hx, hy, ux, uy, l) {
  d.hp -= dmg;
  if (l) {                                                     // the hit shoves the slab round its hinge
    const a = l.base + l.th, lever = Math.hypot(hx - l.hx, hy - l.hy) / l.L;
    l.w += (ux * -Math.sin(a) + uy * Math.cos(a)) * dmg * 0.09 * lever;
  }
  spray(hx - ux * 2, hy - uy * 2, -ux, -uy, 3, WOOD_BITS, 'splinter', 120, 3, 2.4);
  if (d.hp <= 0 && !d.broken) {
    d.broken = true; setDoorSolid(d, false);
    stampWreck(d.rx0, d.ry0, d.rx1 - d.rx0, d.ry1 - d.ry0, ['#5a4330', '#6b5038', '#3a2a1a']);
    spray((d.rx0 + d.rx1) / 2, (d.ry0 + d.ry1) / 2, ux, uy, 10, WOOD_BITS, 'splinter', 160, 4, 2.6);
  }
}
function damageCrate(k, dmg, hx, hy, ux, uy) {
  const hp = (crateHp.has(k) ? crateHp.get(k) : CRATE_HP) - dmg;
  crateHp.set(k, hp);
  spray(hx - ux * 2, hy - uy * 2, -ux, -uy, 3, WOOD_BITS, 'splinter', 120, 3, 2.4);
  if (hp <= 0) {
    grid[k] = 0; opq[k] = 0; solidAt[k] = '.';
    const x = (k % W) * T, y = ((k / W) | 0) * T;
    artG.fillStyle = (FLOOR_COL[floorAt[k]] || FLOOR_COL.z)[0]; artG.fillRect(x, y, T, T);
    stampWreck(x, y, T, T, ['#45382a', '#33291e', '#5a4a35']);
    spray(x + T / 2, y + T / 2, 1, 0, 10, WOOD_BITS, 'splinter', 160, 4, Math.PI * 2);
    rebuildEdges();
  }
}
/* Walls: every hit bites a chip out of the face; each quarter of damage knocks a big chunk loose;
   at zero the tile collapses into rubble you can walk and see through. The outer map edge never breaks. */
function damageWall(k, dmg, hx, hy, nx, ny, owner) {
  const i = k % W, j = (k / W) | 0;
  const border = i === 0 || j === 0 || i === W - 1 || j === H - 1;
  const hp0 = wallHp.has(k) ? wallHp.get(k) : WALL_HP;
  const hp = border ? hp0 : hp0 - dmg;
  wallHp.set(k, hp);
  const worn = 1 - Math.max(0, hp) / WALL_HP;
  notch(hx - nx * 3, hy - ny * 3, 2.5 + 6 * worn, k);
  const s0 = Math.floor((1 - hp0 / WALL_HP) * 4), s1 = Math.floor(worn * 4);
  if (s1 > s0 && hp > 0) {
    notch(hx - nx * 9, hy - ny * 9, 10 + 4 * s1, k);
    spray(hx + nx * 3, hy + ny * 3, nx, ny, 4 + s1, CHUNK_BITS, 'chunk', 150, 6, 2.2);
    burst(hx + nx * 4, hy + ny * 4, 6, 'rgba(150,150,160,0.7)', 60);
  }
  if (hp <= 0 && !border) breakWall(k, owner);
}
/* A ragged bite of exposed concrete, kept inside the wall tile. */
function notch(x, y, r, k) {
  const tx = (k % W) * T, ty = ((k / W) | 0) * T;
  artG.save();
  artG.beginPath(); artG.rect(tx, ty, T, T); artG.clip();
  artG.fillStyle = '#3b3b42'; artG.beginPath();
  for (let q = 0; q < 7; q++) {
    const a = q / 7 * Math.PI * 2, rr = r * (0.6 + Math.random() * 0.6);
    if (q) artG.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); else artG.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  artG.closePath(); artG.fill();
  artG.fillStyle = '#2c2c32'; artG.beginPath(); artG.arc(x, y, r * 0.35, 0, Math.PI * 2); artG.fill();
  artG.restore();
}
function breakWall(k, owner) {
  const i = k % W, j = (k / W) | 0, x = i * T, y = j * T;
  grid[k] = 0; opq[k] = 0; solidAt[k] = '.';
  for (const [a, c] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {        // the rubble sits on the neighbouring floor
    const n = (j + c) * W + i + a;
    if (n >= 0 && n < W * H && solidAt[n] === '.') { floorAt[k] = floorAt[n]; break; }
  }
  artG.fillStyle = (FLOOR_COL[floorAt[k]] || FLOOR_COL.z)[0]; artG.fillRect(x, y, T, T);
  stampWreck(x, y, T, T, ['#4a4a52', '#3c3c43', '#5a5a62', '#2f2f35']);
  spray(x + T / 2, y + T / 2, 1, 0, 14, CHUNK_BITS, 'chunk', 170, 7, Math.PI * 2);
  burst(x + T / 2, y + T / 2, 14, 'rgba(160,160,170,0.7)', 90);
  rebuildEdges();
  if (owner === 'p') makeNoise(x + T / 2, y + T / 2, WALL_NOISE); else emitHeard(x + T / 2, y + T / 2, WALL_NOISE, 'egun', 0.8);
}
const wallish = (i, j) => { if (i < 0 || j < 0 || i >= W || j >= H) return true; const c = solidAt[j * W + i]; return c === '#' || c === 'G' || c === 'g' || c === 'E'; };
function shatterWindow(k, b, hx, hy) {
  solidAt[k] = 'g';
  const i = k % W, j = (k / W) | 0, x = i * T, y = j * T, across = wallish(i - 1, j) || wallish(i + 1, j);
  artG.fillStyle = '#000';
  if (across) artG.fillRect(x, y + T / 2 - 7, T, 14); else artG.fillRect(x + T / 2 - 7, y, 14, T);
  artG.strokeStyle = '#5a6270'; artG.lineWidth = 2; artG.beginPath();
  if (across) { artG.moveTo(x, y + T / 2 - 6); artG.lineTo(x + T, y + T / 2 - 6); artG.moveTo(x, y + T / 2 + 6); artG.lineTo(x + T, y + T / 2 + 6); }
  else { artG.moveTo(x + T / 2 - 6, y); artG.lineTo(x + T / 2 - 6, y + T); artG.moveTo(x + T / 2 + 6, y); artG.lineTo(x + T / 2 + 6, y + T); }
  artG.stroke();
  artG.fillStyle = 'rgba(150,190,220,0.45)';                         // jagged glass left in the frame
  for (let q = 0; q < 5; q++) {
    const u = 4 + Math.random() * (T - 8), top = Math.random() < 0.5, len = 3 + Math.random() * 5;
    artG.beginPath();
    if (across) { const e = y + T / 2 + (top ? -5 : 5); artG.moveTo(x + u - 3, e); artG.lineTo(x + u + 3, e); artG.lineTo(x + u, e + (top ? len : -len)); }
    else { const e = x + T / 2 + (top ? -5 : 5); artG.moveTo(e, y + u - 3); artG.lineTo(e, y + u + 3); artG.lineTo(e + (top ? len : -len), y + u); }
    artG.closePath(); artG.fill();
  }
  spray(hx, hy, b.ux, b.uy, 7, GLASS_BITS, 'shard', 170, 3, 1.4);
  spray(hx, hy, -b.ux, -b.uy, 3, GLASS_BITS, 'shard', 90, 3, 1.6);
  const cx = x + T / 2, cy = y + T / 2;
  if (b.owner === 'p') makeNoise(cx, cy, GLASS_NOISE); else emitHeard(cx, cy, GLASS_NOISE, 'egun', 0.6);
}

/* Paint broken pieces where something was destroyed. They stay for the rest of the match. */
function stampWreck(x, y, w, h, cols) {
  artG.fillStyle = 'rgba(0,0,0,0.22)'; artG.fillRect(x + 5, y + 5, w - 10, h - 10);
  const n = Math.round(7 + (w * h) / (T * T) * 5);
  for (let i = 0; i < n; i++) {
    artG.save();
    artG.translate(x + 4 + Math.random() * (w - 8), y + 4 + Math.random() * (h - 8));
    artG.rotate(Math.random() * Math.PI);
    artG.fillStyle = cols[i % cols.length];
    const L = 6 + Math.random() * 16, Wd = 3 + Math.random() * 6;
    artG.fillRect(-L / 2, -Wd / 2, L, Wd);
    artG.restore();

  let turn = VH ? turnAccum / VH * TURN_SENS : 0;
  turnAccum = 0;
  if (keys.KeyQ || keys.ArrowLeft) turn -= 2.4 * dt;
  if (keys.KeyE || keys.ArrowRight) turn += 2.4 * dt;
  p.aim += turn; turned += Math.abs(turn);
  if (p.aim > Math.PI) p.aim -= Math.PI * 2; else if (p.aim < -Math.PI) p.aim += Math.PI * 2;

  // movement is relative to the screen: up = where you're facing
  let mx = 0, my = 0;
  if (keys.KeyW || keys.ArrowUp) my -= 1;
  if (keys.KeyS || keys.ArrowDown) my += 1;
  if (keys.KeyA) mx -= 1;
  if (keys.KeyD) mx += 1;
  const mv = stickVec(sticks.move);
  mx += mv.x; my += mv.y;
  const len = Math.hypot(mx, my);
  if (len > 1) { mx /= len; my /= len; }
  const th = p.aim + Math.PI / 2, c = Math.cos(th), s = Math.sin(th);
  const wx = mx * c - my * s, wy = my * c + mx * s;
  const ox = p.x, oy = p.y;
  let spd = p.speed * (healing > 0 ? MEDKIT.slow : 1) * (1 - (1 - COVER.duckSpeed) * (p.cov.duck || 0));
  if (wx * wx + wy * wy > 1e-4) spd *= dirSpeed(Math.atan2(wy, wx), p.aim);     // forward fast, sideways slower, backwards slowest
  accelToward(p, state === 'play' ? wx * spd : 0, state === 'play' ? wy * spd : 0, dt);
  if (state === 'play') { moveChar(p, p.vx * dt, p.vy * dt); keepActualSpeed(p, ox, oy, dt); }
  moved += Math.hypot(p.x - ox, p.y - oy);

  // how steady you are, how wide your cone of fire is, how much noise you make
  {
    const speedNow = Math.hypot(p.x - ox, p.y - oy) / Math.max(dt, 1e-4);
    moveAmt += (clamp(speedNow / p.speed, 0, 1) - moveAmt) * Math.min(1, dt * 10);
    if (moveAmt < 0.08) steady = Math.min(1, steady + dt / STEADY_TIME);
    else steady = Math.max(0, steady - dt * 5);
    bloom = Math.max(0, bloom - BLOOM.decay * dt);
    const stepD = Math.hypot(p.x - ox, p.y - oy);
    pAnim.phase += stepD / STEP_LEN * Math.PI;
    if (stepD > 0.3) pAnim.mvAng = Math.atan2(p.y - oy, p.x - ox);
    bootStep(p, stepD, p.aim, pAnim.mvAng);
    springStep(pAnim, 'rx', 'rv', RECOIL.k, RECOIL.c, dt);                // rifle slides back home
    springStep(camKick, 'd', 'v', RECOIL.camK, RECOIL.camC, dt);
    pStride += stepD;
    if (pStride >= P_STRIDE) { pStride = 0; arms.w += arms.foot * ARMS.step * moveAmt; arms.foot = -arms.foot; }   // each step rocks the gun
    turnRate += (Math.abs(turn) / Math.max(dt, 1e-4) - turnRate) * Math.min(1, dt * 4);
    const brace = steady * (1 - clamp(turnRate / BRACE_TURN, 0, 1));            // turning breaks the brace
    if (p.doorTouch) p.doorTouch.t -= dt;
    const pushingDoor = p.doorTouch && p.doorTouch.t > 0;
    senseCover(p, p.aim, moveAmt, dt, reloading > 0 || pushingDoor || pickT > 0);
    easeSupp(p, dt);
    armsStep(arms, dt, turn, brace, p.cov.mount, p.supp);
    sway = arms.th;
    redAng = p.aim + sway;
    const stillH = STILL_HALF + (STEADY_HALF - STILL_HALF) * brace;
    const target = Math.min(MAX_HALF, stillH * (1 - COVER.mountCone * p.cov.mount) + (MOVE_HALF - stillH) * moveAmt
      + (Math.abs(p.cov.sh) < 0.8 ? 0.12 : 0) + (pushingDoor ? 0.06 : 0) + SUPP.cone * (p.supp || 0) + bloom + ARMS.velWiden * Math.abs(arms.w));
    redHalf += (target - redHalf) * Math.min(1, dt * (target > redHalf ? 14 : 5));
    viewR = CONE_R * (1 + STEADY_RANGE * steady);
    redR = RED_R * (1 + STEADY_RANGE * steady);
    zoom = 1 - (1 - STEADY_ZOOM) * steady;
    {                                                // look-ahead: aiming leans the camera forward and toward the drag
      const ast = sticks.aim, held = ast.id !== null, kx = (keys.KeyE || keys.ArrowRight ? 1 : 0) - (keys.KeyQ || keys.ArrowLeft ? 1 : 0);
      const sx = held ? clamp((ast.x - ast.ox) / STICK_R, -1, 1) : kx, k = Math.min(1, dt * LOOK.ease);
      look.x += (-sx * LOOK.side * VW - look.x) * k;
      look.y += ((held || kx ? LOOK.fwd * VH : 0) - look.y) * k;
    }
    if (shots > 0 && state === 'play') tipT += dt;

    const noiseTarget = moveAmt > 0.06 ? WALK_NOISE_MIN + (WALK_NOISE_MAX - WALK_NOISE_MIN) * moveAmt : 0;
    noiseR += (noiseTarget - noiseR) * Math.min(1, dt * 8);
    stepT -= dt;
    if (state === 'play' && noiseR > 40 && stepT <= 0) {
      stepT = 0.5;                                   // a footstep "pulse" twice a second
      const ext = new Float32Array(SOUND_RAYS);
      fillExtents(ext, p.x, p.y, noiseR);
      waves.push({ x: p.x, y: p.y, ext, f: 0, dur: 0.75, kind: 'walk' });
      hearSound(ext, p.x, p.y, 90);
    }
    for (let i = waves.length - 1; i >= 0; i--) { waves[i].f += dt / waves[i].dur; if (waves[i].f >= 1) waves.splice(i, 1); }
    for (let i = prints.length - 1; i >= 0; i--) { prints[i].life -= dt; if (prints[i].life <= 0) prints.splice(i, 1); }
  }

  // bot brains
  if (state === 'play') {
    for (const b of bots) if (!b.dead) updateBot(b, dt, t);
    for (const b of bots) if (!b.dead) moveBot(b, dt);
    separateBots();
    for (const b of bots) if (!b.dead) updateBotAim(b, dt, t);
    for (const b of bots) {                         // their footsteps: one per stride they actually walk
      if (b.dead || b.strideAcc < STRIDE) continue;
      b.strideAcc = Math.min(b.strideAcc - STRIDE, STRIDE);   // no backlog after a long frame
      const ang = Math.atan2(b.y - b.sy, b.x - b.sx);         // direction over the whole stride, not one frame
      b.sx = b.x; b.sy = b.y;
      b.foot = -b.foot; b.stepCount++;
      b.arms.w += b.foot * ARMS.step * b.moveAmt;          // their steps rock their gun too
      const ext = hearAt(b.x, b.y, WALK_NOISE_MIN + (WALK_NOISE_MAX - WALK_NOISE_MIN) * b.moveAmt);
      if (!ext) continue;                                     // you can't hear this step
      const side = b.foot * 6;
      prints.push({ x: b.x - Math.sin(ang) * side, y: b.y + Math.cos(ang) * side, ang, life: PRINT_LIFE });
      if (prints.length > 240) prints.shift();
      if (b.stepCount % 2 === 0) waves.push({ x: b.x, y: b.y, ext, f: 0, dur: 0.75, kind: 'ewalk' });
    }
  }

  // bot visibility to you + red-cone lock
  let anyLocked = false;
  const lockTol = fireCd > -0.2 ? 1.3 : 1;
  for (const b of bots) {
    b.flash = Math.max(0, b.flash - dt);
    const dx = b.x - p.x, dy = b.y - p.y, d = Math.hypot(dx, dy) || 1;
    const ux = dx / d, uy = dy / d, to = Math.atan2(dy, dx), slack = Math.atan2(b.r, d);
    const clear = () => cast(p.x, p.y, ux, uy, d, opaque) >= d - 2;
    let seen = false;
    if (d < AWARE_R + b.r && clear()) seen = true;
    if (!seen && d < viewR && Math.abs(angDiff(to, redAng)) < CONE_HALF + slack && clear()) seen = true;
    if (!seen && !b.dead && b.muzzle > -0.08 && d < viewR * 1.6 && clear()) seen = true;   // their muzzle flash gives them away
    b.locked = !b.dead && seen && d < redR && Math.abs(angDiff(to, redAng)) < redHalf * lockTol + slack;
    if (b.locked) anyLocked = true;
    b.vis += ((seen ? 1 : 0) - b.vis) * Math.min(1, dt * (seen ? 20 : 8));
  }

  // loot fades in when your light touches it
  for (const it of items) {
    const lit = isLit(it.x, it.y, 10);
    it.vis += ((lit ? 1 : 0) - it.vis) * Math.min(1, dt * (lit ? 20 : 8));
  }

  // reload + fire + heal + pick up
  if (state === 'play') {
    if (ammo === 0 && mags.length && reloading === 0) startReload();
    if (reloading > 0) {
      reloading -= dt;
      if (!magDropped && reloading < AR.reload * 0.85) {   // old mag hits the floor (and makes a little noise)
        magDropped = true; ejectMag(p.x, p.y, redAng, ammo, p); ammo = 0; makeNoise(p.x, p.y, 120);
      }
      if (reloading <= 0) { reloading = 0; ammo = pullMag(mags); }
    }
    fireCd -= dt; muzzle -= dt; gunWaveCd -= dt;
    if (anyLocked && reloading === 0 && ammo > 0 && fireCd <= 0 && Math.abs(p.cov.sh) > 0.8) shoot();   // not mid shoulder-switch
    sinceHit += dt;
    if (healing > 0) {
      healing = Math.max(0, healing - dt);
      p.hp = Math.min(PLAYER_HP, p.hp + MEDKIT.heal / MEDKIT.time * dt);
      if (Math.random() < dt * 14) burst(p.x, p.y, 1, '#6dff8a', 70);
    }
    updatePickup(dt);
  }
  hitFlash = Math.max(0, hitFlash - dt);

  updateBullets(dt);
  updateDebris(dt);
  updateSmoke(dt);
  for (let i = flashes.length - 1; i >= 0; i--) { flashes[i].t -= dt; if (flashes[i].t <= 0) flashes.splice(i, 1); }
  barrelWisps(p, redAng, p.cov.sh, pAnim.rx, dt);
  for (const b of bots) barrelWisps(b, b.ang + b.sway, b.cov ? b.cov.sh : 1, b.anim.rx, dt);
  updatePools(dt);
  if (state === 'play') { updateBleed(p, dt); for (const b of bots) updateBleed(b, dt); }
  for (let i = pickFx.length - 1; i >= 0; i--) { pickFx[i].t += dt; if (pickFx[i].t > 0.3) pickFx.splice(i, 1); }
  if (state === 'play') { updateDoors(dt); updateScrapes(); }
  occT -= dt;
  if (occDirty && occT <= 0) { rebuildOcc(); occDirty = false; occT = 0.3; }

  if (state === 'play') {
    const aliveNow = bots.reduce((n, b) => n + (b.dead ? 0 : 1), 0);
    if (aliveNow <= 3) findT += dt;
    if (aliveNow === 0) { state = 'clear'; stateT = 0; }
    else if (ammo === 0 && !mags.length && reloading === 0 && bullets.length === 0 && !items.some(i => i.kind === 'mag')) { state = 'dry'; stateT = 0; }
  }
}

/* ================= RENDER ================= */
const FLOOR = ['#262942', '#282b45', '#2a2d47', '#272a44'];
const FONT = '"Arial Narrow","Roboto Condensed",Impact,sans-serif';

function rayPoly(a0, a1, n, maxD) {
  const pts = [[p.x, p.y]];
  for (let i = 0; i <= n; i++) {
    const a = a0 + (a1 - a0) * i / n, c = Math.cos(a), s = Math.sin(a);
    const d = cast(p.x, p.y, c, s, maxD, opaque);
    pts.push([p.x + c * d, p.y + s * d]);
  }
  return pts;
}
function polyPath(pts) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
}

/* ================= CHARACTERS ================= */
/* Top-down soldiers: boots that stride in the direction of travel, a jacket with a plate carrier,
   shoulders that counter-rotate with each step and rise with each breath, two-jointed arms that
   actually hold the rifle (elbows solved so the hands stay on the gun), and a head on top.
   The rifle is a physical object: it swings on the arm spring and slides back into the shoulder on recoil. */
function rrPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
/* Two-bone arm: given shoulder and hand, find the elbow (bending outward). If the hand is out of reach, the arm straightens. */
function armIK(sx, sy, hx, hy, seg, bend) {
  let dx = hx - sx, dy = hy - sy, d = Math.hypot(dx, dy) || 0.001;
  const max = seg * 2 - 0.01;
  if (d > max) { hx = sx + dx / d * max; hy = sy + dy / d * max; d = max; }
  const a = Math.acos(clamp(d / (2 * seg), -1, 1));
  const base = Math.atan2(hy - sy, hx - sx) + bend * a;
  return [sx + Math.cos(base) * seg, sy + Math.sin(base) * seg, hx, hy];
}
/* AK-47, seen from above: butt at x=0, muzzle at x~56 (0.88 m once scaled). Wooden stock and handguard,
   stamped steel receiver with the ejection port and charging handle on the right, curved magazine,
   gas tube over the barrel, front sight, slant muzzle brake. */
function drawRifle(L, magIn) {
  ctx.fillStyle = L.wood;                                                                       // stock
  ctx.beginPath(); ctx.moveTo(0, -2.7); ctx.lineTo(15, -2.1); ctx.lineTo(15, 2.1); ctx.lineTo(0, 2.7); ctx.closePath(); ctx.fill();
  ctx.fillStyle = L.woodDark; ctx.fillRect(0, -2.7, 1.4, 5.4); ctx.fillRect(3, -0.3, 10, 0.6);   // butt plate, grain
  if (magIn) {                                                                                  // curved magazine
    ctx.fillStyle = L.mag; ctx.beginPath(); ctx.moveTo(21.5, 2.4); ctx.quadraticCurveTo(25.5, 6, 29.5, 9.4);
    ctx.lineTo(26, 10.4); ctx.quadraticCurveTo(22.4, 6.8, 18.8, 2.8); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = L.steel; rrPath(14.5, -2.9, 17.5, 5.8, 1.1); ctx.fill();                      // receiver + dust cover
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 0.6;
  for (const x of [17.5, 19.5, 21.5]) { ctx.beginPath(); ctx.moveTo(x, -2.2); ctx.lineTo(x, 2.2); ctx.stroke(); }
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(21.5, 2.1, 4.5, 0.9);                          // ejection port (right side)
  ctx.fillStyle = L.steel; ctx.fillRect(26.4, 2.6, 1.7, 2.6);                                     // charging handle
  ctx.fillStyle = L.steelDark; ctx.fillRect(31, -2.2, 2.2, 4.4);                                  // rear sight block
  ctx.fillStyle = L.wood; rrPath(33, -2.7, 10, 5.4, 1.2); ctx.fill();                            // handguard
  ctx.fillStyle = L.woodLight; ctx.fillRect(33.5, -1.1, 11, 2.2);                                 // upper handguard over the gas tube
  ctx.fillStyle = L.steelDark;
  ctx.fillRect(43, -1.6, 2.6, 3.2);                                                               // gas block
  ctx.fillRect(45, -0.9, 9, 1.8);                                                                 // barrel
  ctx.fillRect(50, -1.6, 2, 3.2);                                                                 // front sight base
  ctx.beginPath(); ctx.moveTo(53.5, -1.5); ctx.lineTo(56, -1.5); ctx.lineTo(55.2, 1.5); ctx.lineTo(53.5, 1.5); ctx.closePath(); ctx.fill();   // slant brake
  ctx.fillStyle = 'rgba(255,255,255,0.14)'; ctx.fillRect(15, -2.9, 16, 0.9);                      // light on the steel
}

const BOT_LOOK_HIT = Object.assign({}, BOT_LOOK, { rim: '#ffffff', shirt: '#6a3038', jacket: '#6a3038' });
const NO_POSE = { reload: -1, crouch: 0, reach: null, t: 0, phase: 0, walk: 0, mvRel: 0, rx: 0, sh: 1, lean: 0, flash: false, doorHand: null, mountHand: null, prot: null, peekL: null, peekW: null, peekK: 0 };

/* bodyAng: where the torso faces. gunAng: where the rifle points (the arms carry the difference).
   pose: reload 0..1, crouch, reach, phase/walk/mvRel (stride), rx (recoil slide), sh (rifle shoulder), lean,
   flash, doorHand / mountHand, prot (front plate, back plate, helmet, and where they've been hit). */
function drawChar(x, y, bodyAng, gunAng, L, pose) {
  const P = pose || NO_POSE, cr = P.crouch || 0, walk = clamp(P.walk || 0, 0, 1), ph = P.phase || 0, t = P.t || 0;
  const shv = P.sh === undefined ? 1 : P.sh, sgn = shv >= 0 ? 1 : -1, pr = P.prot;
  const ln = (x0, y0, x1, y1) => { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); };
  const pkW = P.peekW || [0, 0], pkL = P.peekL || [0, 0], pkK = P.peekK || 0;
  ctx.save(); ctx.translate(x, y);
  // soft contact shadow: low and crouched it pulls in tight and dark; leaning out, it stays between body and boots
  const sR = (19 - 3.5 * cr) * CHAR_SCALE, sx0 = 1.5 - 0.9 * cr - pkW[0] * 0.5, sy0 = 2.5 - 1.3 * cr - pkW[1] * 0.5;
  const sg = ctx.createRadialGradient(sx0, sy0, 2, sx0, sy0, sR);
  sg.addColorStop(0, 'rgba(0,0,0,' + (0.4 + 0.22 * cr) + ')'); sg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sx0, sy0, sR, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(bodyAng);
  ctx.scale(CHAR_SCALE * (1 - 0.18 * cr), CHAR_SCALE * (1 - 0.2 * cr));   // lower = further from the overhead view
  ctx.translate(0, P.lean || 0);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';

  const rel = angDiff(gunAng, bodyAng), rx = P.rx || 0, gunY = 4.2 * shv;
  let tilt = 0, back = 0, magIn = true;
  if (P.reload >= 0) { const r = P.reload, k = Math.sin(Math.PI * Math.min(1, r * 1.1)); tilt = 0.5 * k * sgn; back = 6 * k; magIn = r < 0.15 || r > 0.78; }
  const cr_ = Math.cos(rel), sr_ = Math.sin(rel), ct = Math.cos(tilt), st = Math.sin(tilt);
  const onGun = (gx, gy) => {
    const tx = (gx - 20) * ct - gy * st + 20, ty = (gx - 20) * st + gy * ct;
    const x1 = tx - 1 - back + rx, y1 = ty + gunY;
    return [(x1 - 4) * cr_ - y1 * sr_ + 4, (x1 - 4) * sr_ + y1 * cr_];
  };
  let hand = null, carrying = false;
  if (P.reload >= 0) {
    const r = P.reload, mp = onGun(24, 6), pouch = [7.5, -2 * sgn];
    if (r >= 0.15 && r < 0.45) { const q = (r - 0.15) / 0.3; hand = [mp[0] + (pouch[0] - mp[0]) * q, mp[1] + (pouch[1] - mp[1]) * q]; }
    else if (r >= 0.45 && r < 0.78) { const q = (r - 0.45) / 0.33; hand = [pouch[0] + (mp[0] - pouch[0]) * q, pouch[1] + (mp[1] - pouch[1]) * q]; carrying = true; }
  }

  // legs: hip -> knee -> boot. Standing, the stride carries them past the body. Crouched, they kneel on the rifle-side
  // knee (that boot dug in behind, sole up) with the other knee forward, knee pads showing. Peeking, the boots stay
  // planted where the lean started and the legs angle out to the body.
  const sw = Math.sin(ph) * 15 * walk, mc = Math.cos(P.mvRel || 0), ms = Math.sin(P.mvRel || 0);
  const mix = (a, b) => a + (b - a) * cr, fo0 = -pkL[0], fo1 = -pkL[1];
  for (const side of [-1, 1]) {
    const trail = side === sgn;
    const sfx = -2 + side * sw * mc, sfy = side * 5.2 + side * sw * ms;
    const H = [-1 + fo0 * 0.45, side * (4.4 - 0.6 * cr) + fo1 * 0.45];
    const F = [mix(sfx, trail ? -16 : 7) + fo0, mix(sfy, side * (trail ? 6.5 : 11.5)) + fo1];
    const K = [mix((sfx - 2.5) / 2, trail ? 1 : 10) + fo0 * 0.75, mix((sfy + side * 4.4) / 2, side * (trail ? 9 : 12.8)) + fo1 * 0.75];   // front knee splays out past the arm
    ctx.save(); ctx.translate(F[0], F[1]);
    if (trail && cr > 0.5) {                                                       // toe dug in, sole and heel up
      ctx.fillStyle = 'rgba(0,0,0,0.55)'; rrPath(-5.2, -3.3, 10, 6.6, 3); ctx.fill();
      ctx.fillStyle = L.boot; rrPath(-4.4, -2.5, 8.4, 5, 2.4); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.13)'; ctx.lineWidth = 0.6; for (const q of [-2.8, -0.9, 1]) ln(q, -1.8, q, 1.8);   // tread
      ctx.fillStyle = 'rgba(0,0,0,0.45)'; rrPath(-4.4, -2.1, 2.2, 4.2, 1); ctx.fill();                                        // heel
    } else {
      ctx.fillStyle = 'rgba(0,0,0,0.55)'; rrPath(-5.6, -3.4, 11.4, 6.8, 3.2); ctx.fill();
      ctx.fillStyle = L.boot; rrPath(-4.8, -2.6, 9.8, 5.2, 2.6); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.10)'; rrPath(0.6, -1.7, 3.6, 3.4, 1.4); ctx.fill();      // toe cap

    ctx.fillStyle = hg; ctx.beginPath(); ctx.ellipse(-0.4, 0, 6.7, 6.2, 0, 0, Math.PI * 2); ctx.fill();

/* A downed body: flat on its back, arms flung out, rifle dropped beside it; whatever armour it still had stays on. */

/* ================= PROTECTION =================
   No health bar: you live on your armour. A round from the front hits the front plate, from behind the back
   plate. Each plate takes about three rifle hits, chipping and cracking, then shatters. With that side's plate
   gone, the helmet takes the hits; when the helmet is shot off, the next unprotected hit kills. */
function newProt() { return { front: PLATE_HP, back: PLATE_HP, helmet: HELMET_HP, chipsF: [], chipsB: [], chipsH: [] }; }

function takeHit(c, dmg, hx, hy, ux, uy) {
  const isP = c === p, L = isP ? PLAYER_LOOK : BOT_LOOK, pr = c.prot || (c.prot = newProt());
  const facing = isP ? p.aim : c.ang;
  const fromFront = Math.abs(angDiff(Math.atan2(-uy, -ux), facing)) < Math.PI / 2;   // which way the round came from
  const a = isP ? arms : c.arms;
  if (a) a.w += (Math.random() < 0.5 ? -1 : 1) * (2 + Math.random() * 2);            // the impact rocks them
  moveCircle(c, ux * 3, uy * 3);
  addSupp(c, SUPP.hit);
  if (isP) { hitFlash = 0.35; sinceHit = 0; } else { c.flash = 0.12; if (c.state !== 'attack') investigate(c, p.x, p.y); }
  const side = fromFront ? 'front' : 'back', chips = fromFront ? pr.chipsF : pr.chipsB;
  if (pr[side] > 0) {                                           // the plate stops it; pieces fly off
    pr[side] -= dmg;
    if (chips.length < 8) chips.push({ y: Math.random() * 2 - 1, d: Math.random() * 2, cx: (Math.random() - 0.5) * 4, cy: (Math.random() - 0.5) * 6 });
    spray(hx - ux * 3, hy - uy * 3, -ux, -uy, 4, CERAMIC, 'chip', 150, 3, 2.4);
    burst(hx, hy, 3, '#ffe9a8', 180);
    if (pr[side] <= 0) {                                        // plate shatters
      pr[side] = 0;
      spray(c.x, c.y, -ux, -uy, 12, CERAMIC, 'chip', 170, 4, Math.PI * 1.4);
      spray(c.x, c.y, ux, uy, 4, CERAMIC, 'shard', 120, 4, 1.2);
    }
    return 'plate';
  }
  if (pr.helmet > 0) {                                          // last piece of protection
    pr.helmet -= dmg;
    if (pr.chipsH.length < 6) pr.chipsH.push({ x: (Math.random() - 0.5) * 7, y: (Math.random() - 0.5) * 7, cx: (Math.random() - 0.5) * 3, cy: (Math.random() - 0.5) * 3 });
    burst(hx, hy, 4, '#ffe9a8', 200);
    spray(c.x, c.y, -ux, -uy, 3, [L.helmet, L.helmetDark], 'chip', 120, 2.5, 2);
    if (pr.helmet <= 0) {                                       // knocked clean off: it clatters across the floor
      pr.helmet = 0;
      debris.push({ x: c.x, y: c.y, vx: ux * 140 + (Math.random() - 0.5) * 60, vy: uy * 140 + (Math.random() - 0.5) * 60,
        rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 14, col: L.helmet, shape: 'helmet', size: 6.6 * CHAR_SCALE, fric: 4, t: 0 });
    }
    return 'helmet';
  }
  bleedHit(c, hx, hy, ux, uy);                                  // nothing left: that one goes through
  if (isP) { if (state === 'play') { p.hp = 0; state = 'dead'; stateT = 0; addPool(p.x, p.y); } }
  else { c.hp = 0; killBot(c); }
  return 'kill';
}

function charPose(c, bodyAng, t, extra) {
  const cv = c.cov || NO_POSE;
  const lean = cv.lean || 0;

    const dx = wx - c.x, dy = wy - c.y, k = Math.cos(-bodyAng), s = Math.sin(-bodyAng);

  };

    sh: cv.sh === undefined ? 1 : cv.sh, lean, flash: false, doorHand: null, mountHand: null, prot: c.prot || null }, extra);
  pose.crouch = Math.max(pose.crouch || 0, (cv.duck || 0) * COVER.duck);       // ducked behind cover
  const px = cv.px || 0, py = cv.py || 0, kc = Math.cos(-bodyAng), ks = Math.sin(-bodyAng);   // peek: body offset from the planted boots
  pose.peekW = [px, py]; pose.peekL = [(px * kc - py * ks) / CHAR_SCALE, (px * ks + py * kc) / CHAR_SCALE];
  pose.peekK = clamp(Math.hypot(px, py) / PEEK.dist, 0, 1);

  if (cv.mount > 0.5 && cv.hand) pose.mountHand = toLocal(cv.hand[0], cv.hand[1]);
  if (pose.reachW) { pose.reach = toLocal(pose.reachW[0], pose.reachW[1]); }

function playerPose(t) {
  const ba0 = p.aim + sway * ARMS.bodyFollow;

    mvRel: angDiff(pAnim.mvAng, ba0), rx: pAnim.rx, flash: muzzle > 0 };
  if (pickItem && pickT > 0) { extra.crouch = Math.min(1, pickT / 0.15); extra.reachW = [pickItem.x, pickItem.y]; }
  return charPose(p, ba0, t, extra);
