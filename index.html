/* Run a drawing function in an "upright on screen" frame centred on a world point. */
function upright(x, y, fn) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.PI / 2 + p.aim); fn(); ctx.restore();
}

function chevron(cx, cy, dir, size) {
  ctx.beginPath();
  ctx.moveTo(cx - dir * size * 0.5, cy - size);
  ctx.lineTo(cx + dir * size * 0.5, cy);
  ctx.lineTo(cx - dir * size * 0.5, cy + size);
  ctx.stroke();
}

function drawMoveStick(st, defX, defY) {
  const active = st.id !== null;
  if (!active && (!isTouch || touchSeen)) return;
  const bx = active ? st.ox : defX, by = active ? st.oy : defY;
  ctx.lineWidth = 3;
  ctx.strokeStyle = active ? 'rgba(170,200,235,0.55)' : 'rgba(170,200,235,0.25)';
  ctx.beginPath(); ctx.arc(bx, by, STICK_R, 0, Math.PI * 2); ctx.stroke();
  let kx = bx, ky = by;
  if (active) {
    const dx = st.x - st.ox, dy = st.y - st.oy, l = Math.hypot(dx, dy) || 1, m = Math.min(l, STICK_R);
    kx = bx + dx / l * m; ky = by + dy / l * m;
  }
  ctx.fillStyle = active ? 'rgba(120,160,195,0.6)' : 'rgba(120,160,195,0.22)';
  ctx.beginPath(); ctx.arc(kx, ky, 26, 0, Math.PI * 2); ctx.fill();
  if (!active) {
    ctx.fillStyle = 'rgba(190,215,245,0.5)'; ctx.textAlign = 'center';
    ctx.font = '600 14px ' + FONT;
    ctx.fillText('MOVE', bx, by + STICK_R + 22);
  }
}

function drawTurnPad(st, defX, defY) {
  const active = st.id !== null;
  if (!isTouch) return;
  if (!active && touchSeen) return;
  ctx.lineWidth = 3;
  if (active) {
    ctx.strokeStyle = 'rgba(170,200,235,0.3)';
    ctx.beginPath(); ctx.moveTo(st.ox, st.oy); ctx.lineTo(st.x, st.y); ctx.stroke();
    ctx.strokeStyle = 'rgba(170,200,235,0.6)';
    ctx.beginPath(); ctx.arc(st.x, st.y, 32, 0, Math.PI * 2); ctx.stroke();
    chevron(st.x - 50, st.y, -1, 9); chevron(st.x + 50, st.y, 1, 9);
  } else {
    ctx.strokeStyle = 'rgba(170,200,235,0.25)';
    ctx.beginPath(); ctx.arc(defX, defY, 32, 0, Math.PI * 2); ctx.stroke();
    chevron(defX - 50, defY, -1, 9); chevron(defX + 50, defY, 1, 9);
    ctx.fillStyle = 'rgba(190,215,245,0.5)'; ctx.textAlign = 'center'; ctx.font = '600 14px ' + FONT;
    ctx.fillText('SWIPE TO TURN', defX, defY + STICK_R + 22);
  }
}

function drawReloadBtn() {
  const b = reloadBtn();
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(170,205,240,0.7)';
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
  if (reloading > 0) {
    const f = 1 - reloading / AR.reload;
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,220,120,0.95)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, -Math.PI / 2, -Math.PI / 2 + f * Math.PI * 2); ctx.stroke();
  }
  // circular-arrow icon
  const ea = Math.PI * 1.35;
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(190,220,250,0.9)'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(b.x, b.y, 16, -0.3, ea); ctx.stroke();
  const ex = b.x + Math.cos(ea) * 16, ey = b.y + Math.sin(ea) * 16;
  const tx = -Math.sin(ea), ty = Math.cos(ea), nx = Math.cos(ea), ny = Math.sin(ea);
  ctx.fillStyle = 'rgba(190,220,250,0.9)';
  ctx.beginPath();
  ctx.moveTo(ex + tx * 10, ey + ty * 10);
  ctx.lineTo(ex + nx * 8, ey + ny * 8);
  ctx.lineTo(ex - nx * 8, ey - ny * 8);
  ctx.closePath(); ctx.fill();
  ctx.lineCap = 'butt';
  // ammo count
  const low = ammo <= 5;
  ctx.font = '700 34px ' + FONT;
  ctx.fillStyle = low ? '#ffb347' : '#a9cdf5';
  ctx.textAlign = 'right'; ctx.fillText(String(ammo), b.x + 6, b.y - b.r - 14);
  for (let i = 0; i < MAG_VEST; i++) {                 // spare magazines in the vest: outline per slot, filled by rounds left
    const x = b.x + 12 + i * 10, y = b.y - b.r - 38, h = 24;
    ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(169,205,245,0.45)'; ctx.strokeRect(x, y, 6, h);
    if (i < mags.length) { const f = mags[i] / AR.mag; ctx.fillStyle = 'rgba(169,205,245,0.85)'; ctx.fillRect(x, y + h * (1 - f), 6, h * f); }
  }
}

function drawHealBtn() {
  const b = healBtn();
  const can = medkits > 0 && p.hp < PLAYER_HP && healing === 0;
  ctx.lineWidth = 4; ctx.strokeStyle = can ? 'rgba(120,255,160,0.85)' : 'rgba(170,205,240,0.35)';
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
  if (healing > 0) {
    const f = 1 - healing / MEDKIT.time;
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(120,255,160,0.95)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, -Math.PI / 2, -Math.PI / 2 + f * Math.PI * 2); ctx.stroke();
  }
  ctx.fillStyle = can || healing > 0 ? 'rgba(150,255,185,0.95)' : 'rgba(170,205,240,0.4)';
  ctx.fillRect(b.x - 5, b.y - 18, 10, 36); ctx.fillRect(b.x - 18, b.y - 5, 36, 10);
  ctx.font = '700 22px ' + FONT; ctx.textAlign = 'center';
  ctx.fillStyle = medkits > 0 ? '#a9f5c0' : 'rgba(169,205,245,0.45)';
  ctx.fillText('x' + medkits, b.x, b.y - b.r - 10);
}

function drawIcon(kind) {
  ctx.lineJoin = 'round';
  if (kind === 'mag') {                                  // a curved AK magazine, brass showing at the lips
    ctx.beginPath(); ctx.moveTo(-3, -12); ctx.lineTo(6, -12); ctx.quadraticCurveTo(5, 4, -1, 13);
    ctx.lineTo(-9, 11); ctx.quadraticCurveTo(-4, 1, -3, -12); ctx.closePath();
    ctx.fillStyle = '#3a3c42'; ctx.fill();
    ctx.save(); ctx.clip(); ctx.fillStyle = '#4c4f57';
    for (const y of [-6, 0, 6]) ctx.fillRect(-10, y, 18, 1.6);   // stamped ribs
    ctx.restore();
    ctx.lineWidth = 2; ctx.strokeStyle = LOOT_COL.mag; ctx.stroke();
    ctx.fillStyle = '#e8b04a'; ctx.beginPath(); ctx.ellipse(1.5, -13, 3.2, 2, 0, 0, Math.PI * 2); ctx.fill();
  } else if (kind === 'helmet') {                        // a spare helmet
    ctx.fillStyle = '#6a5c42'; ctx.beginPath(); ctx.ellipse(0, 0, 13, 12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#8a7a5a'; ctx.beginPath(); ctx.ellipse(0, 0, 11.5, 10.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#5a4c34'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(-7, -9); ctx.lineTo(6, -9); ctx.moveTo(-7, 9); ctx.lineTo(6, 9); ctx.stroke();
    ctx.fillStyle = '#4a4030'; ctx.fillRect(8, -2.5, 4, 5);
    ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.beginPath(); ctx.ellipse(-4, -4, 4, 2.5, -0.5, 0, Math.PI * 2); ctx.fill();
  } else if (kind === 'plate') {                         // a spare armour plate
    ctx.fillStyle = '#5a5e64'; ctx.beginPath(); ctx.moveTo(-9, -13); ctx.lineTo(9, -13); ctx.lineTo(11, -9); ctx.lineTo(11, 13); ctx.lineTo(-11, 13); ctx.lineTo(-11, -9); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#9aa2aa'; ctx.beginPath(); ctx.moveTo(-7, -11); ctx.lineTo(7, -11); ctx.lineTo(9, -8); ctx.lineTo(9, 11); ctx.lineTo(-9, 11); ctx.lineTo(-9, -8); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(-7, -9, 3, 18);
  } else if (kind === 'medkit') {
    ctx.fillStyle = '#e9f3ee'; ctx.fillRect(-13, -10, 26, 20);
    ctx.lineWidth = 2; ctx.strokeStyle = '#7dffa0'; ctx.strokeRect(-13, -10, 26, 20);
    ctx.fillStyle = '#e5222f'; ctx.fillRect(-2.5, -7, 5, 14); ctx.fillRect(-7, -2.5, 14, 5);
  } else {
    ctx.beginPath();
    ctx.moveTo(0, -14); ctx.lineTo(11, -9); ctx.lineTo(10, 3);
    ctx.quadraticCurveTo(8, 10, 0, 14); ctx.quadraticCurveTo(-8, 10, -10, 3);
    ctx.lineTo(-11, -9); ctx.closePath();
    ctx.fillStyle = '#1f9fd0'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#b4ecff'; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(0, 9); ctx.stroke();
  }
}

/* Loot shows as a plain icon once your light finds it. */
function drawItems(t) {
  for (const it of items) {
    if (it.vis < 0.03) continue;
    ctx.globalAlpha = it.vis;
    const k = 1 + Math.sin(t * 3 + it.bob) * 0.05;
    upright(it.x, it.y, () => { ctx.scale(k, k); drawIcon(it.kind); });
  }
  ctx.globalAlpha = 1;
}

function extPath(ext, x, y, f) {
  ctx.beginPath();
  for (let k = 0; k < SOUND_RAYS; k++) {
    const a = k / SOUND_RAYS * Math.PI * 2, r = ext[k] * f;
    const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    if (k) ctx.lineTo(px, py); else ctx.moveTo(px, py);
  }
  ctx.closePath();
}
/* Sound pulses: thin, faint rings that roll outward and are cut short by walls.
   Footsteps are grey-white, gunshots are a little warmer and bigger. */
/* Footprints of enemies you can hear: drawn even in the dark, fading out over a couple of seconds. */
function drawPrints() {
  for (const f of prints) {
    const a = clamp(f.life / 2, 0, 1) * 0.5;      // full strength, then fades out over its last 2 seconds
    ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.ang); ctx.scale(1.3, 1.3);
    ctx.fillStyle = 'rgba(255,150,150,' + a.toFixed(3) + ')';
    ctx.beginPath(); ctx.ellipse(3, 0, 6, 3.6, 0, 0, Math.PI * 2); ctx.fill();    // sole (toes point the way they walk)
    ctx.beginPath(); ctx.ellipse(-6.5, 0, 3, 3, 0, 0, Math.PI * 2); ctx.fill();   // heel
    ctx.restore();
  }
}

const WAVE_STYLE = {
  walk:  ['205,225,245', 0.26],   // your footsteps
  gun:   ['255,205,160', 0.32],   // your gunfire
  ewalk: ['255,140,140', 0.32],   // enemy footsteps you can hear
  egun:  ['255,110,90',  0.40]    // enemy gunfire you can hear
};
function drawSound() {
  const lw = 1.4 / (S * zoom);                 // about a pixel and a half on screen
  for (const w of waves) {
    const [rgb, a0] = WAVE_STYLE[w.kind];
    const e = 1 - (1 - w.f) * (1 - w.f);
    extPath(w.ext, w.x, w.y, e);
    ctx.lineWidth = lw;
    ctx.strokeStyle = 'rgba(' + rgb + ',' + ((1 - w.f) * a0).toFixed(3) + ')';
    ctx.stroke();
  }
}

function pin(cx, cy, col, n) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(cx, cy, 10, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#05070c'; ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e6f0ff'; ctx.textAlign = 'left'; ctx.font = '600 24px ' + FONT;
  ctx.fillText(String(n), cx + 16, cy + 8);
}

function drawParts(parts, cx, y) {
  let total = 0;
  for (const [txt] of parts) total += ctx.measureText(txt).width;
  let x = cx - total / 2;
  ctx.textAlign = 'left';
  ctx.lineJoin = 'round'; ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  for (const [txt, col] of parts) { ctx.strokeText(txt, x, y); ctx.fillStyle = col; ctx.fillText(txt, x, y); x += ctx.measureText(txt).width; }
}

function render(t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, VW, VH);
  const lm = LOOK.margin * S * zoom + 6;           // the character never leaves the screen, whatever the lean
  const ax = VW / 2 + clamp(look.x, lm - VW / 2, VW / 2 - lm), ay = VH * ANCHOR_Y + clamp(look.y, 0, Math.max(0, VH * (1 - ANCHOR_Y) - lm)), sp = state === 'play' ? (p.supp || 0) : 0;
  // camera: player sits low on screen and the world rotates so "facing" is always up; recoil and suppression shake it
  const worldXf = () => {
    ctx.translate(ax, ay); ctx.rotate(-Math.PI / 2 - p.aim); ctx.scale(S * zoom, S * zoom); ctx.translate(-p.x, -p.y);
    ctx.translate(Math.cos(p.aim) * camKick.d + Math.sin(t * 37) * sp * 2.2, Math.sin(p.aim) * camKick.d + Math.cos(t * 29) * sp * 2.2);
  };
  const beamA = redAng;                              // the weapon light points where the rifle points
  const beam = {
    core: rayPoly(beamA - CONE_HALF * 0.5, beamA + CONE_HALF * 0.5, 60, viewR * 1.05),
    spill: rayPoly(beamA - CONE_HALF, beamA + CONE_HALF, 110, viewR),
    halo: rayPoly(beamA - CONE_HALF * 1.6, beamA + CONE_HALF * 1.6, 60, viewR * 0.45)
  };

  // ---- 1) the scene ----
  ctx.save(); worldXf();
  const WM = ctx.getTransform();
  ctx.drawImage(FLOOR_ART, 0, 0);
  drawPieces();
  drawDoors();
  drawItems(t);
  for (const d of debris) drawBit(ctx, d);
  for (const q of pools) drawPool(ctx, q);
  for (const b of bots) if (b.dead) drawCorpse(b.x, b.y, b.ang, BOT_LOOK, b.seed, b.prot);
  for (const b of bots) {                            // living bots (only while you can see them)
    if (b.dead || b.vis < 0.03) continue;
    ctx.globalAlpha = b.vis;
    const bAng = b.ang + b.sway * ARMS.bodyFollow;
    drawChar(b.x, b.y, bAng, b.ang + b.sway, b.flash > 0 ? BOT_LOOK_HIT : BOT_LOOK, charPose(b, bAng, t, {
      reload: b.reloadT > 0 ? 1 - b.reloadT / BOT.reload : -1, phase: b.anim.phase, walk: b.moveAmt,
      mvRel: angDiff(b.mvAng, bAng), rx: b.anim.rx, flash: b.muzzle > 0 }));
    ctx.globalAlpha = 1;
  }
  drawSmoke();
  ctx.restore();

  // ---- 2) darkness, carved away by every light ----
  const lights = gatherLights(t);
  drawLightMap(WM, lights, beam);

  // ---- 3) glow and information over the dark ----
  ctx.save(); worldXf();
  glowLights(lights, beam);
  ctx.save(); polyPath(beam.spill); ctx.clip();      // edges caught by your light
  ctx.lineWidth = 2.2; ctx.strokeStyle = 'rgba(255,242,220,0.55)'; ctx.stroke(EDGES); strokeDoorEdges();
  ctx.restore();
  // red aiming cone
  const red = rayPoly(redAng - redHalf, redAng + redHalf, 22, redR);
  let anyLock = false; for (const b of bots) if (b.locked) anyLock = true;
  polyPath(red);
  let g = ctx.createRadialGradient(p.x, p.y, 20, p.x, p.y, redR);
  g.addColorStop(0, anyLock ? 'rgba(255,60,70,0.22)' : 'rgba(255,60,70,0.10)');
  g.addColorStop(1, anyLock ? 'rgba(255,60,70,0.55)' : 'rgba(255,60,70,0.34)');
  ctx.globalAlpha = reloading > 0 ? 0.3 : 1; ctx.fillStyle = g; ctx.fill(); ctx.globalAlpha = 1;
  drawPrints();
  drawSound();
  for (const b of bots) {                            // labels on bots you can see
    if (b.dead || b.vis < 0.03) continue;
    ctx.globalAlpha = b.vis;
    upright(b.x, b.y, () => {
      ctx.font = '600 12px ' + FONT; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,80,90,0.85)';
      ctx.fillText('BOT', 0, 36);
      if (b.alertT > 0) { ctx.font = '700 28px ' + FONT; ctx.fillStyle = '#ffd24a'; ctx.fillText('!', 0, -46); }
    });
    ctx.globalAlpha = 1;
  }
  // tracers and sparks glow
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const b of bullets) {
    ctx.strokeStyle = 'rgba(255,220,150,0.35)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.ux * 24, b.y - b.uy * 24); ctx.stroke();
    ctx.strokeStyle = '#fff3c4'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.ux * 22, b.y - b.uy * 22); ctx.stroke();
  }
  for (const b of botBullets) {
    ctx.strokeStyle = 'rgba(255,140,90,0.35)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.ux * 24, b.y - b.uy * 24); ctx.stroke();
    ctx.strokeStyle = '#ffc8a0'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.ux * 22, b.y - b.uy * 22); ctx.stroke();
  }
  ctx.lineCap = 'butt';
  for (const sk of sparks) {
    ctx.globalAlpha = clamp(sk.life / sk.max, 0, 1); ctx.fillStyle = sk.col;
    ctx.beginPath(); ctx.arc(sk.x, sk.y, 2.4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  // you (always visible to yourself)
  if (state === 'dead') drawCorpse(p.x, p.y, p.aim, PLAYER_LOOK, 0.3, p.prot);
  else drawChar(p.x, p.y, p.aim + sway * ARMS.bodyFollow, redAng, PLAYER_LOOK, playerPose(t));
  for (const q of pickFx) {
    const f = Math.min(1, q.t / 0.3), e = f * f;
    upright(q.x + (p.x - q.x) * e, q.y + (p.y - q.y) * e, () => {
      ctx.globalAlpha = 1 - f * 0.6; const k = 1 - 0.6 * f; ctx.scale(k, k); drawIcon(q.kind); ctx.globalAlpha = 1;
    });
  }
  if (pickItem && pickT > 0) {
    const f = clamp(pickT / PICK_TIME[pickItem.kind], 0, 1), R = 34;
    ctx.fillStyle = 'rgba(255,165,30,0.2)'; ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,165,30,0.45)'; ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 5; ctx.strokeStyle = '#ffa51e';
    ctx.beginPath(); ctx.arc(p.x, p.y, R, p.aim, p.aim + f * Math.PI * 2); ctx.stroke();
  }
  if (healing > 0) {
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(120,255,160,' + (0.45 + 0.3 * Math.sin(t * 10)).toFixed(2) + ')';
    ctx.beginPath(); ctx.arc(p.x, p.y, 24 + Math.sin(t * 10) * 2, 0, Math.PI * 2); ctx.stroke();
  }
  for (const q of pops) {
    const f = 1 - q.life / q.max;
    upright(q.x, q.y, () => {
      ctx.globalAlpha = clamp(q.life / (q.max * 0.55), 0, 1);
      ctx.font = '700 16px ' + FONT; ctx.textAlign = 'center'; ctx.fillStyle = q.col;
      ctx.fillText(q.txt, 0, -30 - f * 22);
      ctx.globalAlpha = 1;
    });
  }
  ctx.restore();

  // ---- 4) suppression: the view blurs and tunnels in, pulsing with your heartbeat ----
  if (sp > 0.04) {
    if (!postCv) { postCv = document.createElement('canvas'); postG = postCv.getContext('2d'); }
    if (postCv.width !== cv.width || postCv.height !== cv.height) { postCv.width = cv.width; postCv.height = cv.height; }
    postG.setTransform(1, 0, 0, 1, 0, 0); postG.clearRect(0, 0, postCv.width, postCv.height); postG.drawImage(cv, 0, 0);
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (CAN_FILTER) { ctx.filter = 'blur(' + (sp * 3.2 * DPR).toFixed(2) + 'px)'; ctx.globalAlpha = Math.min(1, sp * 1.5); ctx.drawImage(postCv, 0, 0); ctx.filter = 'none'; }
    else { ctx.globalAlpha = 0.22 * sp; for (const [ox, oy] of [[3, 0], [-3, 0], [0, 3], [0, -3]]) ctx.drawImage(postCv, ox * DPR * sp, oy * DPR * sp); }
    ctx.restore();
    const hb = 0.5 + 0.5 * Math.sin(t * (6 + 6 * sp));
    const inner = Math.min(VW, VH) * (0.62 - 0.32 * sp), outer = Math.hypot(VW, VH) * 0.55;
    const vg = ctx.createRadialGradient(ax, VH * 0.6, inner, ax, VH * 0.6, outer);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,' + (0.78 * sp + 0.1 * hb * sp).toFixed(3) + ')');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, VW, VH);
  }

  /* ---------- HUD (screen space) ---------- */
  const aliveBots = bots.reduce((n, b) => n + (b.dead ? 0 : 1), 0);
  ctx.textAlign = 'left'; ctx.fillStyle = '#bcd3f2'; ctx.font = '600 22px ' + FONT;
  ctx.fillText('ALIVE', 18, 32);
  const aw = ctx.measureText('ALIVE').width;
  pin(18 + aw + 22, 24, '#e5222f', aliveBots);
  pin(18 + aw + 92, 24, '#3fd13a', 1);

  drawMoveStick(sticks.move, VW * 0.15, VH * 0.68);
  drawTurnPad(sticks.aim, VW * 0.7, VH * 0.45);
  drawReloadBtn();

  // damage vignette
  if (hitFlash > 0) {
    const vg = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.25, VW / 2, VH / 2, Math.hypot(VW, VH) / 2);
    vg.addColorStop(0, 'rgba(255,0,0,0)'); vg.addColorStop(1, 'rgba(255,30,30,' + (hitFlash * 1.4).toFixed(3) + ')');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, VW, VH);
  }

  if (state !== 'play') {
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, VW, VH);
    ctx.textAlign = 'center'; ctx.fillStyle = '#e6f0ff'; ctx.font = '700 54px ' + FONT;
    ctx.fillText(state === 'clear' ? 'AREA CLEAR' : state === 'dead' ? 'YOU DIED' : 'OUT OF AMMO', VW / 2, VH * 0.46);
    if (stateT > 0.8) {
      ctx.font = '600 22px ' + FONT; ctx.fillStyle = 'rgba(190,215,245,0.9)';
      ctx.fillText(isTouch ? 'TAP TO PLAY AGAIN' : 'CLICK OR PRESS ENTER TO PLAY AGAIN', VW / 2, VH * 0.46 + 44);
    }
  }
}

/* ================= LOOP ================= */
let last = performance.now();
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, 0.05); last = now;
  update(dt, now / 1000);
  render(now / 1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
