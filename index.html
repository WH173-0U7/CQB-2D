/* ---------- props: chairs, stools, restroom fixtures, office and street furniture ----------

function buildProps() {

    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) if (wall(i, j) || doorAt[j * W + i] >= 0) return false;
    for (const o of pieces) if (x < o.x + o.w && x + w > o.x && y < o.y + o.h && y + h > o.y) return false;
    return true;
  };
  const add = (c, cx, cy, w, h, extra) => {
    const x = cx - w / 2, y = cy - h / 2;
    if (!free(x, y, w, h)) return null;
    const F = FURN[c];
    const f = Object.assign({ c, x, y, w, h, pad: 0, hp: F.hp, maxHp: F.hp, mass: F.mass, fixed: !!F.fixed, rot: 0, holes: [],
      seed: Math.random() * 1000, scrape: 0, broken: false, pusher: null, room: floorAt[Math.floor(cy / T) * W + Math.floor(cx / T)] }, extra || {});
    pieces.push(f);

  for (const tb of pieces.filter(f => f.c === 't')) {

    if (pieces.some(o => o.c === 'S' && Math.hypot(o.x + o.w / 2 - cx, o.y + o.h / 2 - cy) < 2.4 * T)) { tb.kind = 'coffee'; continue; }

  for (const dk of pieces.filter(f => f.c === 'D')) {

    add('toilet', 16.6 * T, 9.4 * T, 22, 16); add('bin', 20.4 * T, 9.5 * T, 12, 12); add('bin', 27.5 * T, 18.5 * T, 12, 12);
    add('cab', 22.6 * T, 10 * T - 11, 30, 20);
    add('slamp', 21.5 * T, 23.7 * T, 10, 10, { light: { r: 300, col: [255, 196, 120], k: 0.85 } });
    add('tcan', 9.5 * T, 21.6 * T, 16, 16);

  for (let q = 0; q < 4; q++) {                                    // meeting room chairs round the table
    add('ochair', (30.5 + q) * T, 5.62 * T, 18, 18, { rot: Math.PI / 2 });

  }
  add('ochair', 20.45 * T, 14.5 * T, 18, 18, { rot: Math.PI });   // behind reception
  for (let q = 12; q <= 17; q++) add('stool', 30 * T - 13, (q + 0.5) * T, 14, 14);   // bar stools along the counter
  // restrooms: urinals and two stalls in the men's, three stalls in the women's
  add('urinal', 9.6 * T, 4 * T + 6, 16, 11); add('urinal', 10.8 * T, 4 * T + 6, 16, 11);
  add('toilet', 9.4 * T, 6.6 * T, 22, 16); add('toilet', 9.4 * T, 8.6 * T, 22, 16);
  for (const sy of [5.65, 7.6]) add('stall', 9.6 * T, sy * T, 30, 3);
  for (const ty of [4.8, 6.75, 8.7]) add('toilet', 22.6 * T, ty * T, 22, 16, { rot: Math.PI });
  for (const sy of [5.75, 7.7]) add('stall', 22.4 * T, sy * T, 30, 3);
  add('bin', 11.6 * T, 4.4 * T, 12, 12); add('bin', 20.4 * T, 4.4 * T, 12, 12);
  // lobby, elevator hall, office, lounge
  add('lamp', 13.5 * T, 20.5 * T, 12, 12, { light: LAMP }); add('lamp', 27.5 * T, 20.5 * T, 12, 12, { light: LAMP });
  add('lamp', 22.4 * T, 11.4 * T, 12, 12, { light: LAMP });
  add('vend', 13.55 * T, 7.6 * T, 26, 40, { light: { r: 130, col: [150, 200, 255], k: 0.45 } });
  add('bin', 18.6 * T, 9.6 * T, 12, 12); add('bin', 10.5 * T, 15.5 * T, 12, 12);
  add('cab', 27.3 * T, 4 * T + 11, 30, 20); add('cab', 24.6 * T, 10 * T - 11, 30, 20);
  add('bin', 33.6 * T, 4.5 * T, 12, 12);
  add('ccart', 10 * T, 1.6 * T, 34, 20); add('bin', 26 * T, 1.4 * T, 14, 14);

/* ---------- pushing furniture ---------- */
function boxBlocked(x, y, w, h, self, ignore) {

/* Bodies vs door slabs: walking into a door shoves it round its hinge (easier the further from the hinge you push).

const DT_NOM = 1 / 60;

/* ---------- drawing doors and furniture (live, before the light so it lights them) ---------- */
function doorLeaves(d, fn) { for (const l of d.leaves) fn(l.hx, l.hy, l.base + l.th, l.L); }

/* ================= BOT AI ================= */
/* Bots see you by the same light rules: close up, in their own beam, lit by anything else, or dazzled by your light

function botSees(b, dx, dy, d) {

  if (lightCast(b.x, b.y, dx / d, dy / d, d) < d - 2) return false;
  if (d < BOT.aware) return true;
  const off = Math.abs(angDiff(Math.atan2(dy, dx), b.ang));
  if (hasLight(b) && !b.dark && off < BOT.half) return true;                    // in their own beam (unless it's switched off)
  if (off > SEE.fov && b.state !== 'attack') return false;                        // behind them
  if (d < SEE.dark) return true;                                                  // a shape in the dark, close enough to make out
  if (hasLight(p) && Math.abs(angDiff(Math.atan2(-dy, -dx), redAng)) < CONE_HALF * SEE.glare && d < viewR * 1.4) return true;   // your light in their face

function pickWaypoint(b) {

    const gx = (tx + 0.5) * T, gy = (ty + 0.5) * T;

    const n = path[0], dx = n.x - b.x, dy = n.y - b.y;

    p.blocked = allies.length ? friendInLine(p, allies, redR, redHalf) : null;   // a friend in the line of fire: no auto-fire

/* Camouflage as a repeating pattern (48 units square, wraps seamlessly), used for shirts, trousers and helmet covers.
   blobs: [colour, count, size]. Organic blotches (OCP-style) or blocky clusters (digital). */

        const cells = [];

   flash, doorHand / mountHand, prot (front plate, back plate, helmet, and where they've been hit). */
function drawChar(x, y, bodyAng, gunAng, L, pose) {
  const P = pose || NO_POSE, cr = P.crouch || 0, walk = clamp(P.walk || 0, 0, 1), ph = P.phase || 0, t = P.t || 0;
  const shv = P.sh === undefined ? 1 : P.sh, sgn = shv >= 0 ? 1 : -1, pr = P.prot;
  const ln = (x0, y0, x1, y1) => { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); };
  const pkW = P.peekW || [0, 0], pkL = P.peekL || [0, 0], pkK = P.peekK || 0;
  ctx.save(); ctx.translate(x, y);
  // soft contact shadow: low and crouched it pulls in tight and dark; leaning out, it stays between body and boots
  const kc = Math.cos(bodyAng), ks = Math.sin(bodyAng);
  charKey.x = KEY.x * kc + KEY.y * ks; charKey.y = -KEY.x * ks + KEY.y * kc;      // the key light, in the body's own frame
  if (!P.noShadow) contactShadow(0, 0, cr, pkW);
  ctx.rotate(bodyAng);
  ctx.scale(CHAR_SCALE, CHAR_SCALE);                                              // same size crouched or standing: the pose shows it
  ctx.translate(0, P.lean || 0);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';

  const EQ = P.equip, GR = P.grab, gear = (EQ && EQ.kind !== 'mag') || (GR && GR.kind !== 'mag');
  const rel = angDiff(gunAng, bodyAng) + (gear ? 0.55 * sgn : 0) + (P.gunSw || 0), rx = P.rx || 0, gunY = 4.2 * shv;   // gear going on: rifle hangs off to the side; up against something: swung clear
  let tilt = 0, back = (gear ? 3 : 0) + (P.gunIn || 0), magIn = true;                 // ...and pulled in
  if (P.reload >= 0) {                                                             // cant the rifle in, strip, fetch, seat, rack
    const r = P.reload, k = r < 0.1 ? smooth01(r / 0.1) : r > 0.88 ? smooth01((1 - r) / 0.12) : 1;

  const keys = (r, ks) => {

    if (r >= 0.4 && r < 0.47) { const j = jig(0.8); hand[0] += j[0]; hand[1] += j[1]; }   // digging the next mag out of the pouch

  }
  if (GR) {                                                                        // stoop, reach, close the hand on it, lift
    const r0 = P.reach || lift, rp = [Math.max(4, r0[0]), clamp(r0[1], -18, 18)], g = GR.f;   // never reach back behind you for it

  }
  if (EQ) {
    const f = EQ.f, nl = EQ.L || L; heldL = nl;
    if (EQ.kind === 'mag') {                                                       // into a chest pouch

    } else if (EQ.kind === 'helmet') {                                             // new one tucked against the chest, old one off and dropped, new one on, chin strap

      if (f >= 0.68) { const j = jig(0.7); hand[0] += j[0]; hand[1] += j[1]; }
      if (f < 0.12 || (f >= 0.45 && f < 0.62)) held = 'helmet';
      else if (f >= 0.2 && f < 0.35 && EQ.hadOld) { held = 'helmetOld'; heldL = L; }
      if (f >= 0.12 && f < 0.45) { parked = 'helmet'; parkAt = chest; }

    } else {                                                                       // plate: new one under the arm, open the bag, slide the old out and drop it, slide the new in, close the flap

  const mix = (a, b) => a + (b - a) * crL, fo0 = -pkL[0], fo1 = -pkL[1];
  for (const side of [-1, 1]) {

    const H = [-1 + fo0 * 0.45, side * (4.4 - 0.6 * crL) + fo1 * 0.45];
    const F = [mix(sfx, trail ? -19 : 8.5) + fo0, mix(sfy, side * (trail ? 7.5 : 12.5)) + fo1];
    const K = [mix((sfx - 2.5) / 2, trail ? -2 : 12) + fo0 * 0.75, mix((sfy + side * 4.4) / 2, side * (trail ? 9.5 : 14)) + fo1 * 0.75];   // kneeling: back knee down with the shin trailing behind, front knee splayed out past the arm
    ctx.save(); ctx.translate(F[0], F[1]);

      ctx.fillStyle = 'rgba(0,0,0,0.55)'; rrPath(-5.2, -3.3, 10, 6.6, 3); ctx.fill();
      ctx.fillStyle = L.boot; rrPath(-4.4, -2.5, 8.4, 5, 2.4); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.13)'; ctx.lineWidth = 0.6; for (const q of [-2.8, -0.9, 1]) ln(q, -1.8, q, 1.8);   // tread
      ctx.fillStyle = 'rgba(0,0,0,0.45)'; rrPath(-4.4, -2.1, 2.2, 4.2, 1); ctx.fill();                                        // heel
    } else {

      ctx.fillStyle = 'rgba(255,255,255,0.16)'; ctx.beginPath(); ctx.ellipse(K[0] + 0.7, K[1] - 0.6, 1.4, 0.9, 0, 0, Math.PI * 2); ctx.fill();

  ctx.save(); ctx.rotate(tw); ctx.scale(1, breath * (1 - 0.06 * pkK - CROUCH.round * cr));   // rolled into a lean / hunched: shoulders round in

  const shg = ctx.createLinearGradient(charKey.x * 15, charKey.y * 15, -charKey.x * 15, -charKey.y * 15);   // lit toward the key light, shaded away

  ctx.fillStyle = shg; ctx.fill();
  ctx.fillStyle = L.carrierDark; rrPath(-6, -13.2, 12, 3, 1.4); ctx.fill(); rrPath(-6, 10.2, 12, 3, 1.4); ctx.fill();   // cummerbund

  // plate bags sit on the outside of the chest and back (clear of the head, so you can read them from above)

    ctx.fillStyle = 'rgba(0,0,0,0.5)'; rrPath(x0 - 0.5, -10.6, 5.8, 21.2, 2.2); ctx.fill();

  plate(5.6, bagEmpty === 'front' ? 0 : pr ? pr.front / PLATE_HP : 1, pr && pr.chipsF);
  ctx.strokeStyle = L.carrierDark; ctx.lineWidth = 0.55;                                               // MOLLE webbing showing at the bag edges
  for (const bx of [-10.4, 5.6]) for (let q = -8.5; q <= 8.5; q += 2.4) { ln(bx + 0.1, q, bx + 0.7, q); ln(bx + 4.1, q, bx + 4.7, q); }
  for (const my of [-6.6, -2.2, 2.2]) {                                                                 // triple rifle-mag pouch on the chest, mag tops showing
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; rrPath(10.2, my - 0.2, 3.4, 4.2, 0.8); ctx.fill();
    ctx.fillStyle = L.carrier; rrPath(10.2, my, 3, 3.8, 0.8); ctx.fill();
    ctx.fillStyle = L.mag; ctx.fillRect(11.2, my + 0.6, 1.3, 2.6);
    ctx.strokeStyle = L.carrierDark; ctx.lineWidth = 0.4; ln(10.4, my + 3.4, 13, my + 3.4);

  ctx.fillStyle = 'rgba(0,0,0,0.45)'; rrPath(10.2, 2.6 + 2.6, 2.8, 3.2, 0.8); ctx.fill();               // admin / medical pouch
  ctx.fillStyle = L.carrierDark; rrPath(10.2, 2.6 + 2.4, 2.6, 3, 0.8); ctx.fill();
  ctx.fillStyle = L.carrier; rrPath(-13.4, 4.6, 3.2, 4.2, 0.8); ctx.fill();                           // radio pouch on the back
  ctx.strokeStyle = L.carrierDark; ctx.lineWidth = 0.4; ctx.strokeRect(-13.4, 4.6, 3.2, 4.2);
  ctx.fillStyle = L.carrierDark;
  for (const py of [-13.6, 11]) for (const px of [-3, 0.6]) { rrPath(px, py, 3, 2.6, 0.7); ctx.fill(); }   // mag pouches on the cummerbund
  ctx.fillStyle = 'rgba(255,255,255,0.08)'; for (const py of [-13.6, 11]) for (const px of [-3, 0.6]) ctx.fillRect(px, py, 3, 0.7);
  ctx.fillStyle = L.carrierDark; rrPath(-11.6, -1.6, 1.6, 3.2, 0.6); ctx.fill();                       // drag handle on the back
  ctx.strokeStyle = '#111'; ctx.lineWidth = 0.7; ln(-9.6, 6.6, -13.6, 9.2);                                // radio antenna
  drawFlag(L.flag, -9.6, -7.6, 3.2, 2.2);                                                               // flag patch on the back plate bag
  if (L.tq) {                                                                                           // tourniquet on the front shoulder strap
    ctx.fillStyle = '#1c1c1e'; rrPath(1.6, -9.3, 3.8, 3.8, 0.8); ctx.fill(); ctx.fillStyle = '#b8302a'; ctx.fillRect(4.6, -8.2, 1.2, 1.6);

    ctx.beginPath(); ctx.moveTo(sx + charKey.x * 1.3, sy + charKey.y * 1.3); ctx.lineTo(ex + charKey.x * 1.3, ey + charKey.y * 1.3); ctx.lineTo(hx2 + charKey.x * 1.1, hy2 + charKey.y * 1.1); ctx.stroke();

  ctx.save(); ctx.translate(1 + 3.5 * cr, pkL[1] * 0.3); ctx.rotate(tw * 0.5);   // head ducks low over the knees, or leads the lean

  }

  /* ---------- HUD (screen space) ---------- */
  const aliveBots = bots.reduce((n, b) => n + (b.dead ? 0 : 1), 0);
  ctx.textAlign = 'left'; ctx.fillStyle = '#bcd3f2'; ctx.font = '600 22px ' + FONT;
  if (MAP.bots.length) {                                           // no headcount where there's no enemy
    ctx.fillText('ALIVE', 18, 32);
    const aw = ctx.measureText('ALIVE').width;
    pin(18 + aw + 22, 24, '#e5222f', aliveBots);
    pin(18 + aw + 92, 24, '#3fd13a', 1);
  }

  drawMoveStick(sticks.move, VW * 0.15, VH * 0.68);
  drawTurnPad(sticks.aim, VW * 0.7, VH * 0.45);
  drawReloadBtn();
  drawThreats();
  drawExtractHud(t);

  // damage vignette
  if (hitFlash > 0) {
    const vg = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.25, VW / 2, VH / 2, Math.hypot(VW, VH) / 2);
    vg.addColorStop(0, 'rgba(255,0,0,0)'); vg.addColorStop(1, 'rgba(255,30,30,' + (hitFlash * 1.4).toFixed(3) + ')');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, VW, VH);
  }

  if (state === 'downed') {                                        // bleeding out: the edges close in, darker as it goes
    const rg = rags.find(q => q.c === p), f = rg && rg.alive ? clamp(rg.alive.t / rg.alive.life, 0, 1) : 1, hb = 0.5 + 0.5 * Math.sin(t * (4 - 2 * f));
    const vg = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * (0.45 - 0.3 * f), VW / 2, VH / 2, Math.hypot(VW, VH) / 2);
    vg.addColorStop(0, 'rgba(40,0,0,0)'); vg.addColorStop(1, 'rgba(30,0,0,' + (0.55 + 0.4 * f + 0.05 * hb).toFixed(3) + ')');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, VW, VH);
    ctx.textAlign = 'center'; ctx.font = '700 26px ' + FONT; ctx.fillStyle = 'rgba(230,120,120,' + (0.6 + 0.3 * hb).toFixed(2) + ')';
    ctx.fillText('BLEEDING OUT', VW / 2, VH * 0.2);
  } else if (state !== 'play') {
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, VW, VH);
    ctx.textAlign = 'center'; ctx.fillStyle = '#e6f0ff'; ctx.font = '700 54px ' + FONT;
    ctx.fillText(state === 'clear' ? 'AREA CLEAR' : state === 'dead' ? 'YOU DIED' : 'OUT OF AMMO', VW / 2, VH * 0.46);
    if (stateT > 0.8) {
      ctx.font = '600 22px ' + FONT; ctx.fillStyle = 'rgba(190,215,245,0.9)';
      ctx.fillText(isTouch ? 'TAP TO PLAY AGAIN' : 'CLICK OR PRESS ENTER TO PLAY AGAIN', VW / 2, VH * 0.46 + 44);
    }
  }
}

/* ================= LOOP ================= */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);                         // queued first: one bad frame must never stop the game
  const dt = clamp((now - last) / 1000, 0, 0.05); last = now;
  try { update(dt, now / 1000); render(now / 1000); }
  catch (e) { if (!frame.errs) frame.errs = 0; if (frame.errs++ < 5) console.error(e); }
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
